<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces and text — dark" subtitle="data-theme=\"dark\": same aliases, near-black #0b0c0e page" -->
<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../tokens/fonts-remote.css" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        height: 170px;
        background: var(--surface-page);
        font-family: var(--font-sans);
        display: flex;
      }
      .p {
        padding: 16px 18px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
      }
      .sw {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 5px;
      }
      .chip {
        height: 44px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-default);
      }
      .k {
        font-size: var(--text-2xs);
        color: var(--text-muted);
      }
      .v {
        font-family: var(--font-mono);
        font-size: var(--text-2xs);
        color: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div class="p">
      <div style="display: flex; gap: 8px">
        <div class="sw">
          <div class="chip" style="background: var(--surface-page)"></div>
          <span class="k">page</span><span class="v">--surface-page</span>
        </div>
        <div class="sw">
          <div class="chip" style="background: var(--surface-card)"></div>
          <span class="k">card</span><span class="v">--surface-card</span>
        </div>
        <div class="sw">
          <div class="chip" style="background: var(--surface-raised)"></div>
          <span class="k">raised</span><span class="v">--surface-raised</span>
        </div>
        <div class="sw">
          <div class="chip" style="background: var(--surface-inset)"></div>
          <span class="k">inset</span><span class="v">--surface-inset</span>
        </div>
        <div class="sw">
          <div class="chip" style="background: var(--surface-hover)"></div>
          <span class="k">hover</span><span class="v">--surface-hover</span>
        </div>
        <div class="sw">
          <div class="chip" style="background: var(--surface-selected)"></div>
          <span class="k">selected</span><span class="v">--surface-selected</span>
        </div>
      </div>
      <div style="display: flex; gap: 20px; align-items: baseline">
        <span style="color: var(--text-primary); font-size: var(--text-base); font-weight: 500"
          >Primary</span
        >
        <span style="color: var(--text-body); font-size: var(--text-base)">Body</span>
        <span style="color: var(--text-secondary); font-size: var(--text-base)">Secondary</span>
        <span style="color: var(--text-muted); font-size: var(--text-base)">Muted</span>
        <span style="color: var(--text-link); font-size: var(--text-base)">Link</span>
      </div>
    </div>
  </body>
</html>
