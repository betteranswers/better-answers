<!-- @dsCard group="Brand" viewport="700x180" name="Voice" subtitle="Short, ordinary sentences, in the wording of Kibo UI's patterns" -->
<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Voice</title>
    <link rel="stylesheet" href="../tokens/fonts-remote.css" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--surface-card);
        font-family: var(--font-sans);
        color: var(--text-body);
        height: 180px;
        display: flex;
      }
      .p {
        padding: 14px 18px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 9px;
      }
      .k {
        font-size: var(--text-2xs);
        color: var(--text-muted);
        letter-spacing: var(--tracking-micro);
        text-transform: uppercase;
        font-family: var(--font-mono);
      }
      .g {
        display: grid;
        grid-template-columns: 26px 1fr;
        align-items: baseline;
        column-gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="p">
      <div style="display: flex; gap: 22px; margin-bottom: 2px">
        <span style="font-size: 13px; font-weight: 600; color: var(--text-primary)"
          >Kibo UI's wording</span
        >
        <span style="font-size: 13px; color: var(--text-faint)"
          >A short, ordinary sentence the reader has met in other products.</span
        >
      </div>
      <div class="g">
        <span class="k">Write</span>
        <p style="margin: 0; font-size: 15px; color: var(--text-body)">
          You don't have permission to do this.
        </p>
      </div>
      <div class="g">
        <span class="k">Not</span>
        <p
          style="
            margin: 0;
            font-size: 15px;
            color: var(--text-faint);
            text-decoration: line-through;
          "
        >
          Only an Admin of this workspace sees its members.
        </p>
      </div>
      <div class="g">
        <span class="k">Write</span>
        <p style="margin: 0; font-size: 15px; color: var(--text-body)">
          There was a problem processing your request. Please try again.
        </p>
      </div>
      <div class="g">
        <span class="k">Not</span>
        <p
          style="
            margin: 0;
            font-size: 15px;
            color: var(--text-faint);
            text-decoration: line-through;
          "
        >
          No response, so you haven't joined.
        </p>
      </div>
    </div>
  </body>
</html>
