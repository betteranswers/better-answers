<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base, with 2px and 6px for dense controls" -->
<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Spacing</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--surface-card);
        font-family: var(--font-sans);
        color: var(--text-body);
        height: 150px;
        display: flex;
      }
      .p {
        padding: 16px 18px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }
      .mono {
        font-family: var(--font-mono);
        font-size: var(--text-2xs);
        color: var(--text-faint);
      }
      .sw {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 5px;
      }
      .chip {
        height: 44px;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(11, 12, 14, 0.06);
      }
      .ramp {
        display: flex;
        gap: 6px;
      }
      .k {
        font-size: var(--text-2xs);
        color: var(--text-muted);
      }
      .v {
        font-family: var(--font-mono);
        font-size: var(--text-2xs);
        color: var(--text-faint);
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="p">
      <div style="display: flex; align-items: flex-end; gap: 10px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 2px; height: 14px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">2</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 4px; height: 16px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">4</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 6px; height: 18px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">6</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 8px; height: 20px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">8</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 12px; height: 24px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">12</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 16px; height: 28px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">16</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 20px; height: 32px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">20</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 24px; height: 36px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">24</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 32px; height: 44px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">32</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 40px; height: 52px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">40</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 48px; height: 56px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">48</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <div
            style="width: 64px; height: 56px; background: var(--accent-500); border-radius: 2px"
          ></div>
          <span class="v">64</span>
        </div>
      </div>
    </div>
  </body>
</html>
