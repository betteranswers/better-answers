<!-- @dsCard group="Type" viewport="700x200" name="Display scale" subtitle="Geist 600, tracking −0.022em to −0.014em" -->
<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Display</title>
    <link rel="stylesheet" href="../tokens/fonts-remote.css" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--surface-card);
        font-family: var(--font-sans);
        color: var(--text-body);
        height: 200px;
        display: flex;
      }
      .p {
        padding: 16px 18px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }
      .mono {
        font-family: var(--font-mono);
        font-size: var(--text-2xs);
        color: var(--text-faint);
      }
      .sw {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 5px;
      }
      .chip {
        height: 44px;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(11, 12, 14, 0.06);
      }
      .ramp {
        display: flex;
        gap: 6px;
      }
      .k {
        font-size: var(--text-2xs);
        color: var(--text-muted);
      }
      .v {
        font-family: var(--font-mono);
        font-size: var(--text-2xs);
        color: var(--text-faint);
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="p" style="gap: 6px">
      <div class="row">
        <span
          style="
            font-size: 44px;
            font-weight: 600;
            letter-spacing: -0.022em;
            color: var(--text-primary);
            line-height: 1.1;
          "
          >Every answer cited</span
        ><span class="v">44 / 600</span>
      </div>
      <div class="row">
        <span
          style="
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.022em;
            color: var(--text-primary);
            line-height: 1.15;
          "
          >Permission-aware</span
        ><span class="v">32 / 600</span>
      </div>
      <div class="row">
        <span
          style="
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.014em;
            color: var(--text-primary);
            line-height: 1.2;
          "
          >Explainable</span
        ><span class="v">26 / 600</span>
      </div>
    </div>
  </body>
</html>
