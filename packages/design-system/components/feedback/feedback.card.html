    <style>
      body {
        margin: 0;
        background: var(--surface-page);
        font-family: var(--font-sans);
        color: var(--text-body);
      }
      .wrap {
        padding: 18px 20px;
        display: flex;

      .row {
        display: flex;

  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { NotificationBanner, Details, Toast, Tooltip, Dialog, Button, IconButton, Icon } =
        window.BetterAnswersDesignSystem_22f3cc;
      function Demo() {
        const [open, setOpen] = React.useState(false);
        return (
          <div className="wrap" style={{ position: "relative" }}>
            <div className="col">
              <NotificationBanner
                tone="warning"
                heading="Needs review"
                action={<Button size="sm">Open the change</Button>}
              >
                A concept this section includes changed on 28 August 2026.
              </NotificationBanner>
              <NotificationBanner tone="danger" heading="Extraction ceiling reached">
                Runs are paused. An Admin can raise the ceiling on System.
              </NotificationBanner>
              <NotificationBanner tone="info" heading="Map as of 09:41 · 30 August 2026">
                Every answer below cites the bundle at this commit.
              </NotificationBanner>
            </div>
            <div className="grid2" style={{ alignItems: "start" }}>
              <div className="col">
                <p className="lbl" style={{ margin: 0 }}>
                  One disclosure
                </p>
                <Details summary="Show the passage" defaultOpen>
                  “Certified to ISO 27001 since March 2023, audited annually by BSI.” — Capability
                  statement, p.4
                </Details>
                <Details summary="Who checked this, and when">Priya Shah · 3 March 2026</Details>
                <div className="row">
                  <Tooltip label="Copy with citations  ⌘C">
                    <IconButton label="Copy" variant="outline">
                      <Icon name="copy" />
                    </IconButton>
                  </Tooltip>
                  <Button size="sm" variant="secondary" onClick={() => setOpen(true)}>
                    Open the dialog
                  </Button>
                </div>
              </div>
              <div className="col">
                <p className="lbl" style={{ margin: 0 }}>
                  Toasts
                </p>
                <Toast
                  message="12 concepts accepted."
                  detail="Commit 4f1c9ad · Knowledge"
                  undoLabel="Undo"
                  onUndo={() => {}}
                />
                <Toast
                  tone="danger"
                  message="The binding could not be reached."
                  detail="SharePoint · parked after 3 attempts"
                  onDismiss={() => {}}
                />
              </div>
            </div>
            <Dialog
              open={open}
              title="Accept 12 concepts?"
              description="They enter the bundle as one commit."
              consequence="One governed write. Audited under your name."
              actions={
                <>
                  <Button variant="ghost" onClick={() => setOpen(false)}>
                    Cancel
                  </Button>
                  <Button variant="accent" onClick={() => setOpen(false)}>
                    Accept
                  </Button>
                </>
              }
              onClose={() => setOpen(false)}
            />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
