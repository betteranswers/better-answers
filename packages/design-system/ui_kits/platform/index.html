<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Better Answers — platform UI kit</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <script src="../../_ds_bundle.js"></script>
    <script src="data.js"></script>
    <script>
      window.BADS = window.BetterAnswersDesignSystem_22f3cc;
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--surface-page);
      }
      #root {
        height: 100vh;
      }
      a {
        color: var(--text-link);
        text-decoration: none;
      }
      a:hover {
        color: var(--text-link-hover);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="AppShell.jsx"></script>
    <script type="text/babel" src="AskScreen.jsx"></script>
    <script type="text/babel" src="SearchScreen.jsx"></script>
    <script type="text/babel" src="GuideScreen.jsx"></script>
    <script type="text/babel" src="ControlCentre.jsx"></script>
    <script type="text/babel">
      function App() {
        const [screen, setScreen] = React.useState("ask");
        const S = {
          ask: AskScreen,
          search: SearchScreen,
          guide: GuideScreen,
          suggestions: SuggestionsScreen,
          knowledge: KnowledgeScreen,
          sources: SourcesScreen,
        };
        const names = { questions: "Questions", people: "People", system: "System" };
        const Screen = S[screen];
        return (
          <AppShell screen={screen} setScreen={setScreen}>
            {Screen ? <Screen /> : <PlaceholderScreen name={names[screen] || screen} />}
          </AppShell>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
