# .ordna/config.yaml
storage: namespace
statuses: [todo, doing, done, on-hold]           # Kanban columns, in left-to-right order

namespace:
  pollIntervalMs: 2000           # how often the watcher checks for ref changes
  autoFetchIntervalMs: 0         # background fetch from origin (0 disables)
  autoRenumberOnConflict: true   # auto-renumber + cascade on push collision (false = surface a loud error instead)