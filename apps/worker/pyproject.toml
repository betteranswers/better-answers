[project]
name = "better-answers-worker"
version = "0.1.0"
description = "Better Answers — the Python knowledge worker (ADR 0005)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # The bare repositories the worker reads at a commit (ADR 0024), in-process: the
    # runtime image is python:3.13-slim and carries no git binary, so a pure-Python git
    # implementation is one pinned library rather than a second toolchain to patch.
    # Version read from PyPI's dulwich release metadata on 08/09/2026; Apache-2.0 under
    # its dual licence, which is the arm this repository takes (ADR 0027).
    "dulwich==1.2.14",
    # The claim protocol and every read the two job kinds make. It was in the dev group
    # while nothing in `src` opened a connection; the work loop opens one on every tick,
    # so it belongs to what the image ships.
    "psycopg[binary]==3.3.5",
    "structlog>=26.1.0",
    # The redaction seam's detector (ADR 0020). Presidio is the frame — the registry that
    # runs the recognisers, the context enhancer and the anonymizer that writes the
    # placeholders — and its `gliner` extra is what lets a GLiNER model stand in as the
    # NER. Both halves move together, so both carry the same pin. Versions read from
    # PyPI's release metadata on 11/09/2026; MIT, which is the arm this repository takes
    # (ADR 0027).
    "presidio-analyzer[gliner]==2.2.364",
    "presidio-anonymizer==2.2.364",
    # Named here as well as reached through the extra above: the library that decides what
    # a name or an address is belongs to a version this repository pins itself, and the
    # extra's own range would let it move underneath the recall the fixture proves. Read
    # from PyPI on 11/09/2026; Apache-2.0.
    "gliner==0.2.29",
    # Tokenisation and lemmas only — the seam removes spaCy's own NER recogniser and keeps
    # the pipeline for the lemmas Presidio's context enhancer boosts on. Read from PyPI on
    # 11/09/2026; MIT.
    "spacy==3.8.16",
    # The English pipeline spaCy loads. Explosion publishes it as a GitHub release asset
    # and not to PyPI, so the URL under `tool.uv.sources` is its pin and there is no
    # version to write here. 3.8.0 is the newest English pipeline on that repository's
    # releases, read on 11/09/2026; MIT.
    "en-core-web-sm",
    # GLiNER's tensor runtime, pinned directly so `tool.uv.sources` can send Linux to the
    # CPU wheel index below. Version read from PyPI on 11/09/2026 and resolved out of
    # PyTorch's own CPU channel for Linux, which carries the same release as `+cpu`.
    "torch==2.14.0",
    # The engine this tier hosts (ADR 0036). One package beneath
    # `src/better_answers_worker/pipeline/` composes it and nothing else in the tier may
    # import it — the ban further down is what holds that, and the per-file ignore
    # beneath it is the single exception. The wheels are abi3 against CPython 3.11, so
    # one wheel serves this tier's 3.13, and `cp311-abi3` covers manylinux_2_28 on
    # x86_64 and aarch64 as well as macOS arm64, which is every machine this repository
    # builds on. Version read from PyPI's release metadata on 11/09/2026; Apache-2.0,
    # which is the arm this repository takes (ADR 0027).
    "cocoindex==1.0.22",
    # The driver the engine's Postgres target acquires its own connections through, and
    # the one the pipeline's per-workspace pool is built from. It is named here rather
    # than left to cocoindex's `postgres` extra, whose floor would let the driver move
    # underneath a pool whose connection init is the only thing keeping row-level
    # security in force over the rows a flow lands. Read from PyPI on 11/09/2026;
    # Apache-2.0.
    "asyncpg==0.31.0",
    # The object store client the pipeline reads a landed copy with and writes the
    # normalised copy back through. It is this tier's own rather than the engine's S3
    # source, because the bytes are addressed by keys the document's catalogue row
    # already holds and nothing here walks a bucket. Read from PyPI on 11/09/2026;
    # Apache-2.0.
    "boto3==1.43.92",
]

[project.scripts]
# The gate the root `check` runs: `uv run --frozen check` (AGENTS.md).
check = "better_answers_worker.check:main"
# The work loop — the image's default command, and what a test runs with `--once`.
better-answers-worker = "better_answers_worker.loop:main"

[dependency-groups]
dev = [
    "mutmut>=3.7.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "better_answers_worker"
module-root = "src"

# PyTorch's CPU wheel channel, reached only by what `tool.uv.sources` sends here
# (`explicit`), so nothing else in the tree resolves out of it by accident.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Linux takes the `+cpu` build; macOS arm64 takes PyPI's wheel, which is CPU-only already.
# The detector runs on the CPU by design (ADR 0020), so the CUDA runtime in PyPI's Linux
# wheel is two gigabytes of the worker image that nothing in this estate would ever call.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
# The spaCy pipeline is a release asset, not a PyPI package, so the download URL is the
# pin and the lock records its hash.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "T20", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The other half of the conftest guard: the guard wraps the `monkeypatch` fixture, and
# these two are the way round it. Our own code is never mocked; an external service is
# replaced behind its adapter with an in-memory implementation.
"unittest.mock".msg = "our own code is never mocked; replace the external service behind its adapter"
"mock".msg = "our own code is never mocked; replace the external service behind its adapter"
# The redaction seam is a plain function of its arguments, and a cocoindex type crossing
# into it would make it one only cocoindex could call. The whole tier is banned so that
# the one module allowed to compose the engine has to declare itself: the pipeline module
# lifts this ban for its own directory by a per-file ignore when it lands (ADR 0036).
"cocoindex".msg = "only the pipeline module composes cocoindex, and it lifts this ban by a per-file ignore; a cocoindex type never crosses a module seam"

[tool.ruff.lint.per-file-ignores]
# The check runner is a script; it is the one place print-shaped output is allowed,
# `print` being banned everywhere else in the tier.
"src/better_answers_worker/check.py" = ["T20"]
# The pipeline package, and the one place the cocoindex ban above is lifted: everything
# beneath this directory is the module that composes the engine (ADR 0036), whose public
# interface takes and answers plain types so no cocoindex type crosses a seam. One
# pattern, over that rule alone — a second exemption, or a wider pattern, is what
# `tests/test_cocoindex_ban.py` refuses, because the ban means nothing once more than one
# directory can lift it.
"src/better_answers_worker/pipeline/**" = ["TID251"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# The detector's libraries ship no type information, so an import of one is an error under
# strict mode before a line of ours is read. The overrides are per module and name only
# what the seam imports: strict stays on over everything this repository wrote, and a
# value that arrives from one of these is narrowed on the statement after it arrives
# rather than carried as `Any`. A wildcard here would silence our own code too.
[[tool.mypy.overrides]]
module = [
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "gliner.*",
    "spacy.*",
    # The engine's Postgres target is typed against this driver and names its pool in its
    # own signatures, so the pipeline's pool is the driver's type and not a wrapper of
    # ours. The package ships no marker saying so, which is an error under strict mode
    # before a line of ours is read.
    "asyncpg.*",
    # This tier's own object store client, which ships no marker either. The client's
    # answers are read on the statement after they arrive — the body of a get is taken
    # out of the response and bound to `bytes` there — so nothing untyped travels
    # further than the adapter that made the call. The typed distribution beside it is
    # a second package to pin and to keep in step with the client for two method calls.
    "boto3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers`: a mistyped marker marks nothing and skips nothing, so it must be an
# error rather than a warning nobody reads.
addopts = "-q --strict-markers"
# An expected failure that passes is a bug that was fixed and an `xfail` that outlived it.
xfail_strict = true

# Mutation testing, parked rather than scheduled: no job in .github/workflows/mutation.yml
# runs this today, and `uv run --frozen mutmut run` is the way to run it by hand. The tier's
# mutatable source is a few dozen lines of configuration and logging plus a schema view
# generated from the migration journal, so a score now would measure the generator. The
# settings stay because `T-006` is what gives the worker behaviour worth mutating, and the
# leg rejoins the schedule with it.
# `check.py` is the check runner script, not tier behaviour — the same reason `apps/api`
# leaves `main.ts` and `migrate.ts` out of Stryker's `mutate`.
# `tests/` below is the selection mutmut's stats pass collects, not what every mutant runs:
# a mutant runs only the tests that pass recorded against its function, and one no test
# reached is reported "no tests". So `tests/test_image.py`, which builds the worker image,
# costs one build per `mutmut run` — for as long as it imports nothing from
# `src/better_answers_worker` in-process, which is the same constraint
# `apps/api/tests/image-probe.ts` states for Stryker's static-mutant filter.
[tool.mutmut]
source_paths = ["src/better_answers_worker"]
do_not_mutate = ["src/better_answers_worker/check.py"]
pytest_add_cli_args_test_selection = ["tests/"]
