[project]
name = "better-answers-worker"
version = "0.1.0"
description = "Better Answers — the Python knowledge worker (ADR 0005)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # The runtime image is Distroless and has no git binary, so the worker reads its bare
    # repositories through this pure-Python git library.
    "dulwich==1.2.17",
    "psycopg[binary]==3.3.6",
    "structlog>=26.1.0",
    # Presidio releases these two packages together, so they carry the same pin.
    "presidio-analyzer[gliner]==2.2.364",
    "presidio-anonymizer==2.2.364",
    # Pinned here as well as through the `gliner` extra above. The extra's range would let
    # GLiNER move under the recall that the redaction fixture proves.
    "gliner==0.2.29",
    "spacy==3.8.16",
    # Explosion publishes this pipeline as a GitHub release asset, not on PyPI. The URL under
    # `tool.uv.sources` is its pin, and the lock records its hash.
    "en-core-web-sm",
    # Listed directly so that `tool.uv.sources` can send Linux to the CPU wheel index.
    "torch==2.14.0",
    # `COCOINDEX_DISABLE_USAGE_TRACKING=1` stops the engine from calling
    # `cocoindex.gateway.scarf.sh`, and that was verified against this version only. When you
    # bump the pin, run the engine through a proxy that logs each host it requests, and confirm
    # that it requests none. Then rerun `tests/pipeline/test_pipeline_engine_environment.py` and
    # `test_the_image_and_deploy_unit_refuse_the_engines_gateway_call` in `tests/test_image.py`.
    "cocoindex==1.0.25",
    # Pinned here rather than through the cocoindex `postgres` extra, whose floor would let the
    # driver move. The pipeline's pool connection init is what enforces row-level security.
    "asyncpg==0.32.0",
    "boto3==1.43.115",
    # When you bump either converter, rerun
    # `test_both_converters_hold_on_the_image_under_the_engines_runtime` in `tests/test_image.py`.
    "firecrawl-anydoc==0.2.4",
    "pdf-inspector==1.25.2",
    # No version here. The override under `[tool.uv]` holds the only pin for this package.
    "cryptography",
]

[project.scripts]
check = "better_answers_worker.check:main"
images = "better_answers_worker.check:images"
better-answers-worker = "better_answers_worker.loop:main"
# Do not hand-edit the module this writes. `check` regenerates it and fails if the committed
# copy differs.
generate-contract-stamp = "better_answers_worker.generate_contract_stamp:main"

[dependency-groups]
# The worker leg of `build.yml` installs only this group to run `tests/test_image.py`, which
# reads the image through Docker and does not need torch or the rest of the tier.
probe = ["pytest>=9.1.1"]
dev = [
    { include-group = "probe" },
    "mutmut>=3.7.0",
    "mypy>=2.3.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
    "testcontainers==4.15.0",
    # The root `lint:workflows` linters. They are pinned here so that CI and a laptop run the
    # same version, and so that Renovate's pep621 manager updates them.
    "actionlint-py==1.7.12.25",
    "shellcheck-py==0.11.0.1",
    "zizmor==1.31.1",
]

# uv uses its built-in backend only when its own version is inside this range. Keep the range
# on the minor version of the uv in `apps/worker/.tool-versions` and in the `apps/worker/Dockerfile`
# `FROM ghcr.io/astral-sh/uv:` line.
[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# `presidio-anonymizer` caps `cryptography` below 49, and 48.x has GHSA-g6cj-pr64-35w5,
# GHSA-m2h6-j472-rp4c, and GHSA-jwv3-5hgf-82ww. The override is safe because presidio uses
# only `Cipher(AES, CBC)` and `padding`, and neither API changed in 49 or 50.
#
# Delete this override when a `presidio-anonymizer` release allows 50, and put the version back
# on the dependency. Renovate does not read override lists, so bump this version by hand.
[tool.uv]
override-dependencies = ["cryptography==50.0.1"]

[tool.uv.build-backend]
module-name = "better_answers_worker"
module-root = "src"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# The detector runs on the CPU. PyPI's Linux torch wheel bundles about two gigabytes of CUDA
# that the worker image would never use. The macOS arm64 wheel on PyPI is already CPU-only.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
# The commit hook passes staged files to ruff by name, and ruff lints named files despite
# `extend-exclude` unless `force-exclude` is on.
extend-exclude = [".claude"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "T20", "TID251",
    "PGH003", "PGH004", "FIX001", "FIX002", "FIX003", "FIX004", "RUF100", "C901", "S",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The conftest guard wraps the `monkeypatch` fixture. These two bans block the other way to
# replace our own code in a test.
"unittest.mock".msg = "our own code is never mocked; replace the external service behind its adapter"
"mock".msg = "our own code is never mocked; replace the external service behind its adapter"
"cocoindex".msg = "only the pipeline module composes cocoindex, and it lifts this ban by a per-file ignore; a cocoindex type never crosses a module seam"

[tool.ruff.lint.per-file-ignores]
# `check.py` is the one module allowed to print. S603 is off because it runs only the gate's own
# fixed commands.
"src/better_answers_worker/check.py" = ["T20", "S603"]
# Test code does not ship in the image, so the credential, temp-path, SQL, and subprocess rules
# are off.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "S608"]
# The only place the cocoindex ban is lifted. `tests/gates/test_cocoindex_ban.py` fails on a
# second exemption or a wider pattern.
"src/better_answers_worker/pipeline/**" = ["TID251"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# These libraries ship no type information, which strict mode reports as an error. Name each
# module. A wildcard would also silence errors in our own code.
[[tool.mypy.overrides]]
module = [
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "gliner.*",
    "spacy.*",
    "asyncpg.*",
    # The worker calls two boto3 methods, which does not justify pinning a separate stubs package.
    "boto3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test helpers import as `support.<name>`.
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "image: builds the worker image or reads the workflows that build it; `uv run --frozen images` runs it, `check` does not",
]
xfail_strict = true
# Two warnings come from libraries below the detector, and this tier cannot fix them. Each
# filter matches one warning by category, message, and module, so other warnings still appear.
#
# The first is torch's deprecation of `torch.jit.script`, which transformers calls when GLiNER
# loads DeBERTa. The second is huggingface_hub's deprecation of `resume_download`, which
# `gliner/model.py` still passes in 0.2.29. When either pin moves, delete any filter whose
# warning no longer appears.
filterwarnings = [
    "ignore:`torch\\.jit\\.script` is deprecated:FutureWarning:torch\\.jit\\._script",
    "ignore:The `resume_download` argument is deprecated:UserWarning:huggingface_hub\\.utils\\._validators",
]

# No CI job runs mutmut. Run it by hand with `uv run --frozen mutmut run`. Each run builds the
# worker image once, for `tests/test_image.py`.
[tool.mutmut]
source_paths = ["src/better_answers_worker"]
do_not_mutate = ["src/better_answers_worker/check.py"]
pytest_add_cli_args_test_selection = ["tests/"]
