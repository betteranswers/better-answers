    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"

    <script

    <script src="../../_ds_bundle.js"></script>
    <style>
      body {
        margin: 0;
        background: var(--surface-page);
        font-family: var(--font-sans);
        color: var(--text-body);
      }
      .wrap {
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .lbl {
        font-size: var(--text-2xs);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--text-faint);
        margin: 0 0 8px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { Citation, CoverageBar, TrustTag } = window.BetterAnswersDesignSystem_22f3cc;
      function Demo() {
        return (
          <div className="wrap">
            <div className="col" style={{ gap: "14px" }}>
              <Citation
                marker="1"
                concept="ISO 27001 certification"
                source="Capability statement"
                locator="p.4"
                defaultOpen
                passage="Certified to ISO 27001 since March 2023, audited annually by BSI."
                trust={<TrustTag size="sm" state="checked" by="Priya Shah" at="3 March 2026" />}
              />
              <Citation
                marker="2"
                concept="Data processing locations"
                source="Northgate DPA"
                locator="§7.2"
                passage="All processing takes place in the United Kingdom."
                trust={<TrustTag size="sm" state="out-of-date" />}
              />
              <Citation
                marker="3"
                concept="Standard tier response times"
                source="Service description"
                locator="p.11"
                trust={<TrustTag size="sm" state="unchecked" />}
              />
            </div>
            <div className="grid2">
              <CoverageBar included={9} expected={13} label="Security section" />
              <CoverageBar included={6} expected={6} label="Commercial section" />
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
