<!-- @dsCard group="Components" viewport="700x980" name="Display — frames, cards, tags, trust and tables" subtitle="Frame, Card, Tag, TrustTag, Badge, SummaryList, DataTable, EmptyState, Icon" -->
<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Display components</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <script src="../../_ds_bundle.js"></script>
    <style>
      body {
        margin: 0;
        background: var(--surface-page);
        font-family: var(--font-sans);
        color: var(--text-body);
      }
      .wrap {
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .lbl {
        font-size: var(--text-2xs);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--text-faint);
        margin: 0 0 8px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const {
        Card,
        Frame,
        Tag,
        TrustTag,
        Badge,
        SummaryList,
        DataTable,
        EmptyState,
        Icon,
        Button,
        DotPattern,
      } = window.BetterAnswersDesignSystem_22f3cc;
      const rows = [
        {
          title: "ISO 27001 certification",
          kind: "Certification",
          state: "checked",
          by: "Priya Shah",
          at: "3 March 2026",
          owner: "Priya Shah",
        },
        {
          title: "Standard tier response times",
          kind: "Tier",
          state: "out-of-date",
          owner: "Liam Doyle",
        },
        {
          title: "Data processing locations",
          kind: "Policy",
          state: "unchecked",
          owner: "Unassigned",
        },
      ];
      function Demo() {
        const [sel, setSel] = React.useState([0]);
        return (
          <div className="wrap">
            <div>
              <p className="lbl">Trust words · fixed set</p>
              <div className="row">
                <TrustTag state="checked" by="Priya Shah" at="3 March 2026" />
                <TrustTag state="checked-by-platform" />
                <TrustTag state="unchecked" />
                <TrustTag state="changed-since-checked" />
                <TrustTag state="out-of-date" />
                <TrustTag state="draft" />
                <TrustTag state="restricted" />
                <TrustTag state="deprecated" />
              </div>
            </div>
            <div>
              <p className="lbl">Tags and counts</p>
              <div className="row">
                <Tag>Answer</Tag>
                <Tag tone="accent">Product</Tag>
                <Tag tone="success">Published</Tag>
                <Tag tone="warning">Parked</Tag>
                <Tag tone="danger">Conflict</Tag>
                <Tag size="sm" onRemove={() => {}}>
                  Sensitivity: Restricted
                </Tag>
                <Badge count={12} />
                <Badge count={3} tone="danger" />
                <Badge count={140} tone="accent" />
              </div>
            </div>
            <div>
              <p className="lbl">Card · marked, a direct child of the grid</p>
              <Card
                marks
                title="ISO 27001 certification"
                meta="Certification · Company domain"
                actions={
                  <Button size="sm" variant="ghost">
                    Open
                  </Button>
                }
                footer="Map as of 09:41 · 30 August 2026"
              >
                <SummaryList
                  dense
                  items={[
                    { term: "Owner", description: "Priya Shah" },
                    { term: "Shelf life", description: "12 months" },
                    { term: "Sources", description: "Capability statement (p.4)" },
                  ]}
                />
              </Card>
            </div>
            <div style={{ marginTop: "6px" }}>
              <p className="lbl">DataTable · unmarked, full measure</p>
              <DataTable
                selectable
                selected={sel}
                onSelect={setSel}
                columns={[
                  { key: "title", header: "Concept" },
                  { key: "kind", header: "Kind", render: (r) => <Tag size="sm">{r.kind}</Tag> },
                  { key: "owner", header: "Owner" },
                  {
                    key: "trust",
                    header: "Trust",
                    render: (r) => <TrustTag size="sm" state={r.state} by={r.by} at={r.at} />,
                  },
                ]}
                rows={rows}
              />
            </div>
            <Frame
              label="Frame"
              note="the blueprint object — transparent, marked"
              style={{ position: "relative", marginTop: "6px" }}
            >
              <DotPattern fade />
              <div style={{ position: "relative" }}>
                <EmptyState
                  icon={<Icon name="file-magnifying-glass" size={20} />}
                  title="Nothing on the map answers this."
                  description="Three passages from connected documents mention it."
                  action={
                    <Button variant="accent" size="sm">
                      Suggest a concept
                    </Button>
                  }
                />
              </div>
            </Frame>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
