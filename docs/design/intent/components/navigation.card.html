    <script type="text/babel">

        const [tab, setTab] = React.useState("brief");
        return (
          <div style={{ display: "flex", height: "300px" }}>
            <SideNav

              onChange={setScreen}
              width="216px"

              sections={[
                {
                  items: [
                    { value: "ask", label: "Ask", icon: <Icon name="chat-text" /> },
                    { value: "search", label: "Search", icon: <Icon name="magnifying-glass" /> },
                    { value: "guides", label: "Guides", icon: <Icon name="book-open" /> },

                },
                {
                  label: "Control Centre",

                    { value: "sources", label: "Sources", icon: <Icon name="database" /> },
                    {
                      value: "suggestions",

                      icon: <Icon name="tray" />,
                      trailing: <Badge count={12} />,

                    { value: "knowledge", label: "Knowledge", icon: <Icon name="graph" /> },
                    {
                      value: "questions",
                      label: "Questions",
                      icon: <Icon name="question" />,
                      trailing: <Badge count={3} tone="danger" />,

                    { value: "people", label: "People", icon: <Icon name="users" /> },
                    { value: "system", label: "System", icon: <Icon name="pulse" /> },
                  ],
                },
              ]}
            />
            <div style={{ flex: 1, padding: "16px 20px" }}>
              <Tabs
                value={tab}
                onChange={setTab}
                tabs={[
                  { value: "brief", label: "Brief" },
                  { value: "detail", label: "Detail" },
                  { value: "coverage", label: "Coverage", count: 4 },

              />
              <Tabs
                size="sm"
                style={{ marginTop: "18px" }}

                onChange={setTab}
                tabs={[
                  { value: "brief", label: "Waiting", count: 12 },
