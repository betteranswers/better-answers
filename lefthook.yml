# What each command is for, how to skip one and how the hook is installed:
# docs/operations/local-gates.md
commit-msg:
  commands:
    subject-ceiling:
      run: |
        subject=$(head -n 1 "{1}")
        if [ "${#subject}" -gt 72 ]; then
          echo "commit-msg: the subject is ${#subject} characters and this repository's ceiling is 72."
          echo "Say what is now true in one clause ending with the ticket id in brackets, and put the"
          echo "paragraph in the body, after a blank line. docs/agents/workflow.md, The prose shape."
          exit 1
        fi

pre-commit:
  parallel: true

  commands:
    # `stage_fixed` commits what the formatter wrote, so a formatting-only CI failure cannot happen.
    oxfmt:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    oxlint:
      glob: "*.{ts,tsx}"
      run: pnpm exec oxlint {staged_files}

    ruff-format:
      glob: "*.py"
      root: apps/worker/
      run: uv run --frozen ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      root: apps/worker/
      run: uv run --frozen ruff check {staged_files}

    # A Homebrew binary a clone may not have: a warning and a pass, never a failure.
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        if command -v actionlint >/dev/null 2>&1; then
          actionlint {staged_files}
        else
          echo "warning: actionlint is not installed, skipping. Install it with: brew install actionlint"
          exit 0
        fi

    api-typecheck:
      glob: "*.{ts,tsx}"
      root: apps/api/
      run: pnpm run typecheck

    web-typecheck:
      glob: "*.{ts,tsx}"
      root: apps/web/
      run: pnpm run typecheck

    core-typecheck:
      glob: "*.{ts,tsx}"
      root: packages/core/
      run: pnpm run typecheck

    schema-typecheck:
      glob: "*.{ts,tsx}"
      root: packages/schema/
      run: pnpm run typecheck

    devtools-typecheck:
      glob: "*.{ts,tsx}"
      root: packages/devtools/
      run: pnpm run typecheck
