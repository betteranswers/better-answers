# What each command is for, how to skip one and how the hook is installed:
# docs/operations/local-gates.md
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true

  commands:
    # `stage_fixed` commits what the formatter wrote, so a formatting-only CI failure cannot happen.
    oxfmt:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    oxlint:
      glob: "*.{ts,tsx}"
      run: pnpm exec oxlint --report-unused-disable-directives-severity=error {staged_files}

    ruff-format:
      glob: "*.py"
      root: apps/worker/
      run: uv run --frozen --only-group dev ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      root: apps/worker/
      run: uv run --frozen --only-group dev ruff check {staged_files}

    # The worker's locked actionlint, so a commit and CI read a workflow with one version.
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: uv run --project apps/worker --frozen --only-group dev actionlint -config-file .github/actionlint.yaml {staged_files}

    api-typecheck:
      glob: "*.{ts,tsx}"
      root: apps/api/
      run: pnpm run typecheck

    web-typecheck:
      glob: "*.{ts,tsx}"
      root: apps/web/
      run: pnpm run typecheck

    core-typecheck:
      glob: "*.{ts,tsx}"
      root: packages/core/
      run: pnpm run typecheck

    schema-typecheck:
      glob: "*.{ts,tsx}"
      root: packages/schema/
      run: pnpm run typecheck

    devtools-typecheck:
      glob: "*.{ts,tsx}"
      root: packages/devtools/
      run: pnpm run typecheck

templates:
  # A worktree's push sets GIT_DIR, which a suite's throwaway repository would then write into.
  without-git-env: unset $(git rev-parse --local-env-vars);

pre-push:
  parallel: true
  # Naming {files} stops lefthook skipping a push that changes no file on disk, or only deletes.
  files: echo lefthook.yml

  commands:
    format:check:
      run: ": {files}; {without-git-env} pnpm run format:check"
      fail_text: "run it alone with pnpm run format:check"

    lint:
      run: ": {files}; {without-git-env} pnpm run lint"
      fail_text: "run it alone with pnpm run lint"

    lint:workflows:
      run: ": {files}; {without-git-env} pnpm run lint:workflows"
      fail_text: "run it alone with pnpm run lint:workflows"

    comment-gate:python:
      run: ": {files}; {without-git-env} pnpm run comment-gate:python"
      fail_text: "run it alone with pnpm run comment-gate:python"

    comment-density:
      run: ": {files}; {without-git-env} pnpm run comment-density"
      fail_text: "run it alone with pnpm run comment-density"

    insert-scan:
      run: ": {files}; {without-git-env} pnpm run insert-scan"
      fail_text: "run it alone with pnpm run insert-scan"

    jscpd:
      run: ": {files}; {without-git-env} pnpm run jscpd"
      fail_text: "run it alone with pnpm run jscpd"

    knip:
      run: ": {files}; {without-git-env} pnpm run knip"
      fail_text: "run it alone with pnpm run knip"

    check:docs:api:
      run: ": {files}; {without-git-env} pnpm run check:docs:api"
      fail_text: "run it alone with pnpm run check:docs:api"

    check:docs:core:
      run: ": {files}; {without-git-env} pnpm run check:docs:core"
      fail_text: "run it alone with pnpm run check:docs:core"

    check:docs:web:
      run: ": {files}; {without-git-env} pnpm run check:docs:web"
      fail_text: "run it alone with pnpm run check:docs:web"
