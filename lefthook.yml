# The pre-commit hook: the first word on a mistake, local and in seconds.
#
# One hook, its commands in parallel over staged files only. No test suite lives here —
# `pnpm check` owns those. Five commands each run one workspace's own `typecheck` script
# (`tsc --noEmit`) over its own staged `.ts`/`.tsx` files, so a staged type error is refused
# at commit. Measured cold on this machine (Apple M4 Pro, 14 cores, 24 GiB; Docker VM 10
# CPUs, 15.6 GiB; 12/09/2026): api 1.9s, web 1.8s, core 1.6s, schema 1.8s, devtools 1.0s —
# api is the worst case, and `parallel: true` makes every command wait on the slowest rather
# than the sum, so that number is the hook's own added cost.
#
# A command runs only when a file under its own workspace is staged: a change in
# `packages/core` that breaks `apps/api`'s types passes this hook whenever no `apps/api`
# file is staged beside it. That is the price of a hook that stays seconds long rather than
# minutes; root `check` owns the cross-workspace case, and always will.
#
# HOW TO SKIP, when you mean to:
#
#   LEFTHOOK=0 git commit …                     the whole hook, once
#   LEFTHOOK_EXCLUDE=oxlint git commit …        one command
#   LEFTHOOK_EXCLUDE=oxfmt,oxlint git commit …  several, comma-separated
#
# The command names below are the names those variables take. A deliberate skip is one of
# these; it is never a deleted hook file, because the next `pnpm install` writes it back and
# the reason for the skip goes with it.
#
# HOW IT IS INSTALLED. The root `prepare` script runs `lefthook install`, and pnpm runs
# `prepare` after every install — so a fresh clone gets the hook with no step to remember.
# lefthook ships its own postinstall that would do the same, but pnpm 11 only runs a
# dependency's lifecycle scripts when the workspace file's `allowBuilds` says so, and that
# list is for native builds we have inspected, not for a tool wiring itself into `.git`.
# So `allowBuilds` refuses lefthook's postinstall (`lefthook: false`) and `prepare` does the
# installing in the open, in a script anyone reading that manifest can see.
#
# `prepare` falls back to a message rather than failing, because pnpm runs it in two places
# that have no business holding a hook: the api's runtime image, where `--prod` leaves
# lefthook out of the tree entirely, and any install outside a git working tree. A fresh
# developer clone is the case that must work, and `.github/workflows/check.yml` asserts it
# on the only genuinely fresh clone we get — so the fallback cannot hide a real failure.

pre-commit:
  parallel: true

  commands:
    # The formatter writes, and `stage_fixed` puts what it wrote into the commit — so a
    # formatting-only CI failure cannot happen and no second commit is needed to fix it.
    #
    # `--no-error-on-unmatched-pattern` is what makes handing over the whole staged set safe.
    oxfmt:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    oxlint:
      glob: "*.{ts,tsx}"
      run: pnpm exec oxlint {staged_files}

    # Both tiers get the same first word. `root:` makes the staged paths relative to the
    # worker, which is where `uv` finds the locked environment ruff lives in.
    ruff-format:
      glob: "*.py"
      root: apps/worker/
      run: uv run --frozen ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      root: apps/worker/
      run: uv run --frozen ruff check {staged_files}

    # actionlint is a Homebrew binary, not an npm package, so a clone may not have it. A
    # warning and a pass, never a failure: a tool nobody installed must not block a commit.
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        if command -v actionlint >/dev/null 2>&1; then
          actionlint {staged_files}
        else
          echo "warning: actionlint is not installed, skipping. Install it with: brew install actionlint"
          exit 0
        fi

    # Every workspace with a `typecheck` script but the design system, which has neither a
    # `tsconfig.json` nor a `scripts` block. `root:` is what scopes each command to its own
    # workspace's staged files, so these five never see each other's changes.
    api-typecheck:
      glob: "*.{ts,tsx}"
      root: apps/api/
      run: |
        # tsc --noEmit, from this workspace's own typescript devDependency
        pnpm run typecheck

    web-typecheck:
      glob: "*.{ts,tsx}"
      root: apps/web/
      run: |
        # tsc --noEmit, from this workspace's own typescript devDependency
        pnpm run typecheck

    core-typecheck:
      glob: "*.{ts,tsx}"
      root: packages/core/
      run: |
        # tsc --noEmit, from this workspace's own typescript devDependency
        pnpm run typecheck

    schema-typecheck:
      glob: "*.{ts,tsx}"
      root: packages/schema/
      run: |
        # tsc --noEmit, from this workspace's own typescript devDependency
        pnpm run typecheck

    devtools-typecheck:
      glob: "*.{ts,tsx}"
      root: packages/devtools/
      run: |
        # tsc --noEmit, from this workspace's own typescript devDependency
        pnpm run typecheck
