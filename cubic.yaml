# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json


version: 1
reviews:
  enabled: true
  sensitivity: medium
  incremental_commits: true
  check_drafts: false
  architecture_diagrams: true
  external_contributors_require_manual_review: false
  resolve_threads_when_addressed: true
  merge_confidence_summary: false
  auto_approve_behavior: disabled
  auto_approve: disabled
  auto_approve_rules:
    exclude_external_contributors: false
  ultrareview: manual
  auto_ultrareview: high_risk_only

  custom_instructions: |
    - The owner is not a developer - you are the last line of defence.
    - Deep modules. Much behaviour behind a small interface. A wide interface
      over thin behaviour is a finding even when the code is correct.

  ignore:
    files:
      - cubic.yaml
      - "**/lifts/**"
      - .scratch/**
      - .planning/**
      - "**/reports/**"
      - pnpm-lock.yaml
      - apps/worker/uv.lock
      - packages/core/test/**
      - packages/schema/test/**
      - apps/api/tests/**
      - apps/web/e2e/**
      - apps/web/test/**
      - apps/worker/tests/**
      - packages/devtools/test/**
      - packages/design-system/guidelines/**
      - packages/design-system/thumbnail.html
      - docs/**
      - .claude/skills/**
      - apps/api/.claude/skills/**
      - .claude/agents/**
      - .claude/settings.json
      - packages/schema/migrations/meta/**

pr_descriptions:
  generate: false
  cubic_review_link: false
  skip_if_author_description: true
issues:
  fix_with_cubic_buttons: true
  pr_comment_fixes: true
  fix_commits_to_pr: true
  auto_fix_sign_commits: false
  coding_agent_provider: cubic
