packages:
  - apps/api
  - apps/web
  - packages/*

allowBuilds:
  '@ast-grep/cli': true
  cpu-features: false
  esbuild: true
  lefthook: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - zod@4.5.4
  - '@aws-sdk/client-s3@3.1130.0'
  - '@aws-sdk/lib-storage@3.1130.0'

patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
