packages:
  - apps/api
  - apps/test-inbox
  - apps/web
  - packages/*

# `false` rather than no entry: pnpm 11 makes an undecided build script a hard error.
allowBuilds:
  '@ast-grep/cli': false
  cpu-features: false
  esbuild: true
  lefthook: false
  protobufjs: false
  ssh2: false

patchedDependencies:
  '@stryker-mutator/vitest-runner': patches/@stryker-mutator__vitest-runner.patch
  testcontainers: patches/testcontainers.patch

# `@trpc/server` needs TypeScript for its types alone, yet names it a required peer, which pnpm
# installs, native compiler included, in the api's image.
overrides:
  '@trpc/server>typescript': '-'
