name: better-answers-stores

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "10" }

x-mem-128: &mem128
  deploy: { resources: { limits: { memory: 128m } } }
x-mem-384: &mem384
  deploy: { resources: { limits: { memory: 384m } } }

services:
  init:
    image: alpine:3.23.5@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    # Quoted: a missing `restart` becomes unless-stopped, and bare `no` is YAML false.
    restart: "no"
    <<: *mem128
    command: >
      sh -ec '
        for d in objectstore:1000 git:1000 worker/lmdb:1000 worker/trees:1000 backup/staging:1000 mirror:1000; do
          p=/data/$${d%%:*}; u=$${d##*:}; mkdir -p "$$p"; [ "$$(stat -c %u "$$p")" = "$$u" ] || chown -R "$$u:$$u" "$$p";
        done'
    volumes: ["/data:/data"]
    labels: { coolify.exclude_from_hc: "true" }

  objectstore:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    <<: [*restart, *logging, *mem384]
    command: ["/garage", "server", "--single-node"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
    # Exec form: the image carries no shell and no wget, so an HTTP probe cannot run inside.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 3s
      retries: 12
    volumes:
      - /data/objectstore:/data
      - ./garage.toml:/etc/garage.toml:ro
    depends_on:
      init: { condition: service_completed_successfully }

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    <<: [*restart, *logging, *mem128]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}

  backup:
    image: ghcr.io/betteranswers/backup@${BACKUP_IMAGE_DIGEST:?set from build.yml's run summary}
    <<: [*restart, *logging, *mem384]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?}
      RCLONE_CONFIG_DUMPS_TYPE: s3
      RCLONE_CONFIG_DUMPS_PROVIDER: ${BACKUP_S3_PROVIDER:?}
      RCLONE_CONFIG_DUMPS_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
      RCLONE_CONFIG_DUMPS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:?}
      RCLONE_CONFIG_DUMPS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:?}
      BACKUP_DUMPS_BUCKET: ${BACKUP_DUMPS_BUCKET:?}
      BACKUP_MIRROR_BUCKET: ${BACKUP_MIRROR_BUCKET:?}
      RCLONE_CONFIG_SRC_TYPE: s3
      RCLONE_CONFIG_SRC_PROVIDER: Other
      RCLONE_CONFIG_SRC_ENDPOINT: http://objectstore:3900
      RCLONE_CONFIG_SRC_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_SRC_REGION: garage
      RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${OBJECTSTORE_ROOT_KEY:?}
      RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${OBJECTSTORE_ROOT_SECRET:?}
      GIT_MIRROR_SSH_TARGET: ${GIT_MIRROR_SSH_TARGET:?}
      HEALTHCHECKS_PING_URL_PG_HOURLY: ${HEALTHCHECKS_PING_URL_PG_HOURLY:?}
      HEALTHCHECKS_PING_URL_NIGHTLY: ${HEALTHCHECKS_PING_URL_NIGHTLY:?}
    # `-x cron`, not `crond`: the image is Debian-based and its daemon is `cron -f`.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x cron >/dev/null && [ $(find /staging -type f -mmin +1440 | wc -l) -eq 0 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
    volumes:
      - /data/git:/data/git:ro
      - /data/backup/mirror-ssh:/root/.ssh:ro
      - /data/backup/staging:/staging
    depends_on:
      objectstore: { condition: service_healthy }
