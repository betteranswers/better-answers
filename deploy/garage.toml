# The two secrets arrive as environment variables: nothing writes the `*_file` paths.
metadata_dir = "/data/meta"
data_dir = "/data/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".objectstore"

[admin]
api_bind_addr = "0.0.0.0:3903"
