services:
  postgres:
    image: ${TEST_POSTGRES_IMAGE:?deploy/test-postgres.sh sets it from packages/schema/src/postgres-image.ts}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:${TEST_POSTGRES_PORT:?deploy/test-postgres.sh sets it}:5432"]
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      # Four worktrees' checks at once: three workspaces of 6 workers at 8 connections, plus pytest's 4 workers, each times four.
      - -c
      - max_connections=800
      # Every clone is written into WAL, which shares the tmpfs, so WAL needs a fixed ceiling.
      - -c
      - max_wal_size=512MB
    # Parallel queries take dynamic shared memory from /dev/shm, and Docker's 64 MB default runs short.
    shm_size: 256m
    # Over TCP: the image's first-boot server listens on the socket alone, and must not read as up.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
        tmpfs:
          # WAL at twice its soft ceiling (1 GiB), 88 clones and a day's 16 templates at 16 MB (12 measured), a 40 MB empty cluster.
          size: 3gb
