name: check

on:
  pull_request:
  # Without this the queue waits on a run that never starts.
  merge_group:
  # `build.yml` calls this on main, so a push runs `check` once rather than twice.
  workflow_call:
    inputs:
      images-probed-by-the-caller:
        description: >-
          Set by a caller whose own job builds the images, loads each one that has a
          contents test and runs that test against the build it is about to push (`T-043`).
          The suites here then leave those tests to that job, so a push to main builds a
          probed image once rather than once on this runner and once on that one. A merge
          group has no such job and passes nothing, so it probes when an image's inputs changed.
          It reaches every leg whose suites read it — the api's and the worker's — and no
          other; `packages/devtools/test/ci/image-job.test.ts` holds that both ways.
        type: boolean
        default: false
    # Passed by name from `build.yml`; a called workflow reads no secret it was not handed.
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

# A pull request cancels the run it supersedes; a run `build.yml` calls never does,
# because every commit that lands is worth an image.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A release, not the `ubuntu-latest` label, which GitHub is moving to Ubuntu 26; every
  # `runs-on:` in this directory names one.
  lane:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      images: ${{ steps.lane.outputs.images }}
      dependencies: ${{ steps.lane.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The base is fetched one commit deep, and anonymously, the repository being public:
      # `git diff` between two trees needs no ancestry.
      - name: the lane this change runs in
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_TARGET: ${{ github.event.merge_group.base_ref }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          # `base_sha` is the head of the group queued ahead, whose changes merge with this one, so
          # the diff starts at the target branch.
          case "${EVENT}" in
            merge_group) base="${MERGE_GROUP_TARGET}" ;;
            pull_request) base="${PULL_REQUEST_BASE}" ;;
            push | workflow_call) base="${PUSHED_FROM}" ;;
            *) base="" ;;
          esac
          lane=full
          images=yes
          dependencies=yes
          if [ -n "${base}" ] && [ "${base}" != "0000000000000000000000000000000000000000" ] &&
            git fetch --no-tags --depth=1 origin "${base}" &&
            from="$(git rev-parse FETCH_HEAD)" &&
            git diff -z --name-only --no-renames "${from}" HEAD > "${RUNNER_TEMP}/changed-paths"; then
            echo "the changed paths are read from ${base}, at ${from}, to HEAD"
            # Read back here so that an unknown word is refused below, not published.
            decided="$(node scripts/docs-lane.mjs < "${RUNNER_TEMP}/changed-paths")"
            lane="$(printf '%s\n' "${decided}" | sed -n 's/^lane=//p')"
            images="$(printf '%s\n' "${decided}" | sed -n 's/^images=//p')"
            dependencies="$(printf '%s\n' "${decided}" | sed -n 's/^dependencies=//p')"
          else
            echo "::notice::no diff against a base (event ${EVENT}, base '${base}'), so this run takes every path as changed"
          fi
          # The queue runs the suites on the tree that lands, so a pull request runs none. It
          # typechecks when its dependencies moved, because a dependency pull request is Renovate's,
          # and nothing ran its types before the queue; every other lane typechecks whole or not at all.
          if [ "${EVENT}" = "pull_request" ]; then
            lane="pr"
          else
            dependencies=no
          fi
          # Every leg is gated on these words, so a fourth is a run that requires nothing.
          case "${lane}" in
            pr | docs | full) ;;
            *)
              echo "::error::the lane resolved to '${lane}', which is no lane this workflow has"
              exit 1
              ;;
          esac
          case "${images}" in
            yes | no) ;;
            *)
              echo "::error::whether an image's inputs changed resolved to '${images}', which is neither yes nor no"
              exit 1
              ;;
          esac
          case "${dependencies}" in
            yes | no) ;;
            *)
              echo "::error::whether a pull request's dependencies changed resolved to '${dependencies}', which is neither yes nor no"
              exit 1
              ;;
          esac
          echo "this run is in the ${lane} lane, an image's inputs changed: ${images}, and it typechecks a dependency change: ${dependencies}"
          {
            echo "lane=${lane}"
            echo "images=${images}"
            echo "dependencies=${dependencies}"
          } >> "$GITHUB_OUTPUT"

  docs-gates:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'docs' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs

  full-root:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # Unpinned, this action takes whatever uv is newest, which is not the uv the worker
      # image was built with.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # The only fresh clone in CI, so the only place install's promise can be tested.
      - name: the pre-commit hook is installed by install alone
        run: |
          hook="$(git rev-parse --git-path hooks)/pre-commit"
          test -x "$hook" || { echo "no executable pre-commit hook at $hook"; exit 1; }
          grep -q lefthook "$hook" || { echo "$hook is not lefthook's"; exit 1; }
      - run: uv sync --frozen
        working-directory: apps/worker
      # The suites' Postgres and the images they build pull from Docker Hub, whose anonymous
      # limit is the runner address's and is shared with strangers (BA-96).
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # `check:tree` less `packages/core`'s suite, which is `full-core`'s.
      - run: pnpm check:root

  # vitest deals files to the shards by a hash of their paths, not by what they cost.
  full-core:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      # Cancelling the other shard would hide its failures until this one's were fixed.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - name: HF_HOME on the runner's own temp directory, not the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      # The cross-tier suite runs the worker over an index job, which loads the detector's
      # models; without this the shard holding it fetches them afresh every run. Restore
      # only: `build.yml`'s `caches` job writes the entry on main, where every ref reads it.
      - name: the redaction detector's weights, keyed on the pins that name them
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      - uses: ./.github/actions/git-filter-repo
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: pnpm check:core:suite --shard="${SHARD}"
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

  full-api:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    # The image probes read the layer cache `build.yml` writes to the private packages.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - name: HF_HOME on the runner's own temp directory, not the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      # This leg runs the worker over an index job, which loads the detector's models;
      # without this it fetches them afresh every run. Restore only, as in `full-core`.
      - name: the redaction detector's weights, keyed on the pins that name them
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      # The daemon's own builder reads no registry cache unless it keeps images in containerd,
      # which the runner's does not.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/git-filter-repo
      - run: pnpm check:api
        env:
          IMAGE_PROBE_DEFERRED: ${{ inputs.images-probed-by-the-caller || needs.lane.outputs.images == 'no' }}
          IMAGE_CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}

  full-web:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @better-answers/web exec playwright install --with-deps chromium
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: pnpm check:web
        env:
          TRACE_ARTIFACT: browser-traces-attempt-${{ github.run_attempt }}
      # Not failure(): a flake passes on its retry, and its trace is the one worth reading.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces-attempt-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  full-worker:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Weights inside the checkout are read by every tree walker too, and a job's own
      # `env:` cannot reach the `runner` context.
      - name: HF_HOME on the runner's own temp directory, not the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # pnpm verifies the tree before it runs a script, so `check:worker` installs
          # whether this leg asked for it or not.
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      # Restore only, as in `full-core`.
      - name: the redaction detector's weights, keyed on the pins that name them
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
      - run: uv sync --frozen
        working-directory: apps/worker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: pnpm check:worker
        env:
          IMAGE_PROBE_DEFERRED: ${{ inputs.images-probed-by-the-caller || needs.lane.outputs.images == 'no' }}
          IMAGE_CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          # Without it every run tells a third party what this repository is building, once
          # per document.
          COCOINDEX_DISABLE_USAGE_TRACKING: "1"

  # The title becomes the merge commit's subject, so the queue reads it again: a retitle after
  # a green run reaches the queue unread otherwise.
  pr-title:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Read when it runs, not from the event, so a re-run reads a retitle. A merge group's ref
      # names its pull request. commitlint comes from the root manifest's pins rather than an
      # install, so a stale lockfile fails `pr-lockfile` and not this job.
      - name: the pull request's title, through commitlint
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          QUEUED_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          number="${PULL_REQUEST:-$(printf '%s\n' "${QUEUED_REF}" | sed -n 's|^refs/heads/gh-readonly-queue/.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$|\1|p')}"
          if [ -z "${number}" ]; then
            echo "::error::no pull request number in this event (ref '${QUEUED_REF}')"
            exit 1
          fi
          cli="$(jq -re '.devDependencies["@commitlint/cli"]' package.json)"
          preset="$(jq -re '.devDependencies["@commitlint/config-conventional"]' package.json)"
          title="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq .title)"
          printf '%s\n' "${title}" |
            pnpm dlx --package="@commitlint/cli@${cli}" --package="@commitlint/config-conventional@${preset}" commitlint

  # Every manifest against the lockfile, with nothing downloaded: a stale lockfile fails here,
  # under its own name, before the queue's install meets it.
  pr-lockfile:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'pr' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts

  # No lane's leg: it runs on a pull request whose dependencies moved, and the verdict wants its
  # skip everywhere else, which a `pr-` name would not let it say.
  dependency-typecheck:
    needs: lane
    if: ${{ needs.lane.outputs.dependencies == 'yes' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # `packages/devtools`' typecheck runs mypy through the worker's environment, so a Python
      # change reaches both halves.
      - run: uv sync --frozen
        working-directory: apps/worker
      - run: pnpm -r --no-bail --if-present run typecheck
      - run: uv run --frozen mypy
        working-directory: apps/worker

  check:
    needs:
      [
        lane,
        docs-gates,
        full-root,
        full-core,
        full-api,
        full-web,
        full-worker,
        pr-title,
        pr-lockfile,
        dependency-typecheck,
      ]
    # A skipped required check never reports, so this runs whatever the legs did.
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: every leg this lane names is green, and every other leg stood down
        env:
          LANE: ${{ needs.lane.outputs.lane }}
          LEGS: ${{ toJSON(needs) }}
          TITLE_WANTED: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'success' || 'skipped' }}
          TYPECHECK_WANTED: ${{ (needs.lane.outputs.dependencies == 'yes') && 'success' || 'skipped' }}
        run: |
          named=0
          required=0
          wrong=""
          for leg in $(printf '%s' "${LEGS}" | jq -r 'keys[]'); do
            named=$((named + 1))
            was="$(printf '%s' "${LEGS}" | jq -r --arg leg "${leg}" '.[$leg].result')"
            case "${leg}" in
              lane) wanted=success ;;
              pr-title) wanted="${TITLE_WANTED}" ;;
              dependency-typecheck)
                wanted="${TYPECHECK_WANTED}"
                if [ "${wanted}" = "success" ]; then required=$((required + 1)); fi
                ;;
              "${LANE}-"*) wanted=success; required=$((required + 1)) ;;
              *) wanted=skipped ;;
            esac
            echo "${leg}: ${was} (this lane wants ${wanted})"
            [ "${was}" = "${wanted}" ] || wrong="${wrong} ${leg}=${was}"
          done
          # The title is the one thing every pull request is read for, so the pr lane requires it.
          if [ "${LANE}" = "pr" ] && [ "${TITLE_WANTED}" = "success" ]; then
            required=$((required + 1))
          fi
          # A floor, not a count to keep current: a verdict requiring nothing of anybody passes, and
          # a pr-lane verdict that read no title passes on the lockfile alone.
          if [ "${named}" -lt 2 ] || [ "${required}" -lt 1 ] ||
            { [ "${LANE}" = "pr" ] && [ "${TITLE_WANTED}" != "success" ]; }; then
            echo "::error::this verdict read ${named} jobs and required ${required} of them, so it proved nothing"
            exit 1
          fi
          if [ -n "${wrong}" ]; then
            echo "::error::check is not green:${wrong}"
            exit 1
          fi
          echo "the ${LANE} lane is green: ${required} required jobs"
