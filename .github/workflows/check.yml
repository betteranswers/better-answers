# `check` on every PR and on main — lint, types, tests per workspace (AGENTS.md).
# Hosted Ubuntu runners ship Docker, so Testcontainers ([TEST2]) runs unchanged.
# Action versions read from each repository's latest release on 28/08/2026 — research/41-deploy-facts.md §1 ([DEPS1]); Renovate pins them to digests.
name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      # One command, every workspace — the root `check` runs them all.
      - run: pnpm check
