# `check` on every PR, and on main as build.yml's first job — lint, types, tests per
# workspace (AGENTS.md). One definition of `check`, called from both places.
# Hosted Ubuntu runners ship Docker, so Testcontainers ([TEST2]) runs unchanged.
# Action versions read from each repository's latest release on 28/08/2026 — research/41-deploy-facts.md §1 ([DEPS1]); Renovate pins them to digests.
name: check

on:
  pull_request:
  # On main this workflow is CALLED by build.yml as its first job, so a push runs `check`
  # once — before the images are built, never beside them (`T-018`). Two triggers would also
  # have the two runs cancel each other on the concurrency group below.
  workflow_call:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      # The SPA's `check` ends in a browser suite over the served build ([TEST1]); the
      # browser is not in the pnpm store, so it is installed here. Chromium alone: the
      # suite runs one project.
      - run: pnpm --filter @better-answers/web exec playwright install --with-deps chromium
      # One command, every workspace — the root `check` runs them all.
      - run: pnpm check
