# `check` on every PR, and on main as build.yml's first job — lint, types, tests per
# workspace (AGENTS.md). One definition of `check`, called from both places.
# Hosted Ubuntu runners ship Docker, so Testcontainers ([TEST2]) runs unchanged.
# Action versions read from each repository's latest release on 28/08/2026 — research/41-deploy-facts.md §1 ([DEPS1]).
#
# EVERY `uses:` IN THIS DIRECTORY NAMES A COMMIT SHA, with its tag beside it as a comment: the
# tag is what a person reads and what Renovate rewrites, the SHA is what runs. A tag is a
# moving reference into somebody else's repository, and these workflows hold a token that can
# push our images. "Renovate pins them to digests" stood in this header from 28/08/2026 as a
# plan, and every file went on using tags until `T-040` resolved them (GitHub API,
# `git/ref/tags/<tag>`, annotated tags dereferenced, 03/09/2026). `renovate.json` keeps them
# pinned — `pinDigests` on the `github-actions` manager, which is what the
# `helpers:pinGitHubActionDigests` preset sets.
name: check

on:
  pull_request:
  # On main this workflow is CALLED by build.yml as its first job, so a push runs `check`
  # once — before the images are built, never beside them (`T-018`). A `push` trigger here as
  # well would put both runs in the one group below and have them queue behind each other.
  workflow_call:

# A pull request cancels the run it supersedes; a run CALLED by build.yml never does.
#
# This block is evaluated in the caller's context, so `check-refs/heads/main` was one group
# holding every push to main with `cancel-in-progress: true` — and build.yml asks for the
# opposite in its own group (`build-main`, `cancel-in-progress: false`) because an image is
# worth building for every commit that lands. Two fast pushes and the second run cancelled the
# first run's `check` job, taking the images it gates with it (`T-040`).
#
# The condition holds whichever value a called run reads: GitHub documents `github.event_name`
# as "the name of the event that triggered the workflow run" without saying, for a reusable
# workflow, whether that is the caller's event or `workflow_call` — and neither of those is
# `pull_request`. Only a run triggered directly by a pull request cancels, either way.
#
# The group must also stay different from build.yml's: a called workflow that waits on its
# caller's group waits on itself.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      # The SPA's `check` ends in a browser suite over the served build ([TEST1]); the
      # browser is not in the pnpm store, so it is installed here. Chromium alone: the
      # suite runs one project.
      - run: pnpm --filter @better-answers/web exec playwright install --with-deps chromium
      # One command, every workspace — the root `check` runs them all.
      - run: pnpm check
