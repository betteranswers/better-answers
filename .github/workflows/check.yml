# `check` on every PR, and on main as build.yml's first job — lint, types, tests per
# workspace (AGENTS.md). One definition of `check`, called from both places.
# Hosted Ubuntu runners ship Docker, so Testcontainers runs unchanged.
# Action versions read from each repository's latest release on 28/08/2026 — research/41-deploy-facts.md §1.
#
# EVERY `uses:` IN THIS DIRECTORY NAMES A COMMIT SHA, with its tag beside it as a comment: the
# tag is what a person reads and what Renovate rewrites, the SHA is what runs. A tag is a
# moving reference into somebody else's repository, and these workflows hold a token that can
# push our images. "Renovate pins them to digests" stood in this header from 28/08/2026 as a
# plan, and every file went on using tags until `T-040` resolved them (GitHub API,
# `git/ref/tags/<tag>`, annotated tags dereferenced, 03/09/2026). `renovate.json` keeps them
# pinned — `pinDigests` on the `github-actions` manager, which is what the
# `helpers:pinGitHubActionDigests` preset sets.
name: check

on:
  pull_request:
  # On main this workflow is CALLED by build.yml as its first job, so a push runs `check`
  # once — before the images are built, never beside them (`T-018`). A `push` trigger here as
  # well would put both runs in the one group below and have them queue behind each other.
  workflow_call:
    inputs:
      images-probed-by-the-caller:
        description: >-
          Set by a caller whose own job builds the images, loads each one that has a
          contents test and runs that test against the build it is about to push (`T-043`).
          The suite here then leaves those tests to that job, so a push to main builds a
          probed image once rather than once on this runner and once on that one. A pull
          request builds no image, has no such job, passes nothing, and probes as usual.
        type: boolean
        default: false

# A pull request cancels the run it supersedes; a run CALLED by build.yml never does.
#
# This block is evaluated in the caller's context, so `check-refs/heads/main` was one group
# holding every push to main with `cancel-in-progress: true` — and build.yml asks for the
# opposite in its own group (`build-main`, `cancel-in-progress: false`) because an image is
# worth building for every commit that lands. Two fast pushes and the second run cancelled the
# first run's `check` job, taking the images it gates with it (`T-040`).
#
# The condition holds whichever value a called run reads: GitHub documents `github.event_name`
# as "the name of the event that triggered the workflow run" without saying, for a reusable
# workflow, whether that is the caller's event or `workflow_call` — and neither of those is
# `pull_request`. Only a run triggered directly by a pull request cancels, either way.
#
# The group must also stay different from build.yml's: a called workflow that waits on its
# caller's group waits on itself.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The redaction detector's model weights are fetched on first use and land under
      # the runner's own temp directory, never inside the checkout: a cache restored into
      # the checkout sits where every tree walker in this job reads it too — oxfmt, the
      # tag scan, knip, jscpd — and one landed there read as unformatted JSON by the first
      # and as a string too long to hold by the second, on a run where the cache happened
      # to be warm before either walker ran. `runner.temp` is this job's own scratch space
      # and nothing a tree walker visits. A job's own `env:` cannot read the `runner`
      # context (GitHub's context-availability table), so the value is written to
      # `$GITHUB_ENV` here instead, once, before anything downstream needs it — the cache
      # step below still has one path to name and the worker's suite still finds the
      # weights warm. The worker reads this from the process, never from a file: the
      # location is the deploy unit's to decide, and the compose file sets the same
      # variable for the running container.
      - name: HF_HOME on the runner's own temp directory, not the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # This checkout is the only fresh clone we ever get, so it is the only place the
      # promise "install and the hook is there" can actually be tested. The config test
      # reads the hook's configuration; nothing but a clone can prove the install wrote the
      # hook script itself.
      - name: the pre-commit hook is installed by install alone
        run: |
          hook="$(git rev-parse --git-path hooks)/pre-commit"
          test -x "$hook" || { echo "no executable pre-commit hook at $hook"; exit 1; }
          grep -q lefthook "$hook" || { echo "$hook is not lefthook's"; exit 1; }
      # Hundreds of megabytes of detector weights, fetched once and restored on every run
      # after it. The key hashes the module the versions and the model id are declared in,
      # so a model or a package the weights answer to moving is a miss and a fresh
      # download — a key that named only the operating system would serve the old weights
      # to the new pin and nobody would see it happen.
      - name: the redaction detector's weights, keyed on the pins that name them
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
      - run: uv sync --frozen
        working-directory: apps/worker
      # The SPA's `check` ends in a browser suite over the served build; the
      # browser is not in the pnpm store, so it is installed here. Chromium alone: the
      # suite runs one project.
      - run: pnpm --filter @better-answers/web exec playwright install --with-deps chromium
      # `git-filter-repo` is what the erasure routine's git step shells out to (`T-124`,
      # ADR 0020), and `ubuntu-latest` does not carry it: without this step `packages/core`'s
      # erasure suite fails here while every machine it was written on is green. There is no
      # skip guard in that suite on purpose — a red run on the one step that rewrites a
      # workspace's history irreversibly is the coverage this workflow exists to provide.
      #
      # THE VERSION IS READ OUT OF `apps/api/Dockerfile`, NOT WRITTEN HERE. Do not tidy it
      # into a literal. A rewrite proved against one version of the tool and run against
      # another is a rewrite nobody has tested, so the runner and the api image must carry
      # the same one — and the constitution's dependency rule is that a pinned version is
      # written down once and read from there, because a second copy ages on its own. An
      # action cannot import a constant, so reading the pin out of the file that declares it
      # is the substitute, the way `apps/worker/tests/pg_harness.py` reads the Postgres image
      # out of the module that declares that. `apps/api/tests/workflow-tools.test.ts` holds
      # this step to both halves of that.
      - name: the rewrite tool the erasure suite runs, at the version the api image pins
        run: |
          pinned="$(sed -n 's/^ARG GIT_FILTER_REPO_VERSION=//p' apps/api/Dockerfile)"
          test -n "$pinned" || { echo "apps/api/Dockerfile pins no GIT_FILTER_REPO_VERSION"; exit 1; }
          uv tool install "git-filter-repo==$pinned"
          bin="$(uv tool dir --bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          # Proved here rather than left to the suite, so an install that put the tool
          # somewhere git cannot reach fails on this line and not three hundred tests later.
          # `--version`, not `--help`: git answers a subcommand's `--help` by opening its man
          # page, which the runner does not carry, and exits 16 with the tool installed (PR #57's
          # first CI run, 11/09/2026); `--version` is answered by the tool itself.
          PATH="$bin:$PATH" git filter-repo --version > /dev/null
      # One command, every workspace — the root `check` runs them all. The image tests read
      # the variable below and stand down when the caller's own job probes what it pushes;
      # a pull request evaluates it to the empty string and probes.
      - run: pnpm check
        env:
          IMAGE_PROBE_DEFERRED: ${{ inputs.images-probed-by-the-caller }}
