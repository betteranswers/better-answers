name: check

on:
  pull_request:
  # `build.yml` calls this on main, so a push runs `check` once, not twice.
  workflow_call:
    inputs:
      images-probed-by-the-caller:
        description: >-
          Set by a caller whose own job builds the images, loads each one that has a
          contents test, and runs that test against the build it is about to push.
          The suites here then skip those tests, so a push to main builds each probed image
          once instead of twice. A pull request has no such job and passes nothing, so it
          probes when an image's inputs changed. Only the `full-images` leg reads this input;
          `packages/devtools/test/ci/image-job.test.ts` checks that.
        type: boolean
        default: false
    # Passed by name from `build.yml`; a called workflow can read only the secrets it is passed.
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

# A pull request cancels the run it replaces. A run that `build.yml` calls never does,
# because every commit that lands on main needs its image.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A fixed release, not `ubuntu-latest`, which GitHub is moving to Ubuntu 26. Every
  # `runs-on:` in this directory names a fixed release.
  lane:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      images: ${{ steps.lane.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fetches the base one commit deep and anonymously, because the repository is public:
      # `git diff` between two trees needs no history.
      - name: Choose the lane for this change
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          case "${EVENT}" in
            pull_request) base="${PULL_REQUEST_BASE}" ;;
            push | workflow_call) base="${PUSHED_FROM}" ;;
            *) base="" ;;
          esac
          lane=full
          images=yes
          if [ -n "${base}" ] && [ "${base}" != "0000000000000000000000000000000000000000" ] &&
            git fetch --no-tags --depth=1 origin "${base}" &&
            from="$(git rev-parse FETCH_HEAD)" &&
            git diff -z --name-only --no-renames "${from}" HEAD > "${RUNNER_TEMP}/changed-paths"; then
            echo "the changed paths are read from ${base}, at ${from}, to HEAD"
            # Read back here, so an unknown value fails below instead of being published.
            decided="$(node scripts/docs-lane.mjs < "${RUNNER_TEMP}/changed-paths")"
            lane="$(printf '%s\n' "${decided}" | sed -n 's/^lane=//p')"
            images="$(printf '%s\n' "${decided}" | sed -n 's/^images=//p')"
          else
            echo "::notice::no base to diff against (event ${EVENT}, base '${base}'), so this run treats every path as changed"
          fi
          case "${lane}" in
            docs | full) ;;
            *)
              echo "::error::the lane resolved to '${lane}', but this workflow has no lane by that name. scripts/docs-lane.mjs must print docs or full."
              exit 1
              ;;
          esac
          case "${images}" in
            yes | no) ;;
            *)
              echo "::error::images resolved to '${images}', which is neither yes nor no. scripts/docs-lane.mjs must print one of them."
              exit 1
              ;;
          esac
          echo "this run is in the ${lane} lane, and an image's inputs changed: ${images}"
          {
            echo "lane=${lane}"
            echo "images=${images}"
          } >> "$GITHUB_OUTPUT"

  docs-gates:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'docs' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs

  full-root:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # Without a pinned version, this action installs the newest uv, not the uv the worker
      # image was built with.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # The only fresh clone in CI, so the only place to test that install sets up the hook.
      - name: Check that pnpm install alone installs the pre-commit hook
        run: |
          hook="$(git rev-parse --git-path hooks)/pre-commit"
          test -x "$hook" || { echo "no executable pre-commit hook at $hook"; exit 1; }
          grep -q lefthook "$hook" || { echo "$hook is not lefthook's"; exit 1; }
      - run: uv sync --frozen
        working-directory: apps/worker
      # The suites' Postgres and the images they build pull from Docker Hub, whose anonymous
      # rate limit applies per runner address and is shared with other users.
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # `check:tree` without the `packages/core` suite, which `full-core` runs.
      - run: pnpm check:root

  full-core:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - name: Put HF_HOME in the runner's temp directory, outside the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      # The cross-tier suite runs the worker on an index job, which loads the detector's
      # models; without this cache it downloads them on every run. This job only restores:
      # the `caches` job in `build.yml` saves the entry on main, where every ref can read it.
      - name: Restore the redaction detector's weights, keyed on its model pins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      - uses: ./.github/actions/git-filter-repo
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: pnpm check:core:suite

  full-api:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - name: Put HF_HOME in the runner's temp directory, outside the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      # This leg runs the worker on an index job, which loads the detector's models; without
      # this cache it downloads them on every run. Restore only, as in `full-core`.
      - name: Restore the redaction detector's weights, keyed on its model pins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/git-filter-repo
      - run: pnpm check:api

  full-web-unit:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web:unit

  # Playwright splits tests, not files, across the shards, because the suite is fully parallel.
  full-web-browser:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      # Cancelling the other shard would hide its failures until this one's were fixed.
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TRACE_ARTIFACT: browser-traces-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @better-answers/web exec playwright install --with-deps chromium
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: pnpm check:web:e2e --shard="${SHARD}"
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Not failure(): a flaky test passes on retry, and its trace is the one worth reading.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.TRACE_ARTIFACT }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  full-worker:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Weights inside the checkout would be read by every tree walker, and a job's own
      # `env:` cannot use the `runner` context.
      - name: Put HF_HOME in the runner's temp directory, outside the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # pnpm checks the install before it runs a script, so `pnpm check:worker` installs
          # Node dependencies in this leg too, and the cache speeds that up.
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      # Restore only, as in `full-core`.
      - name: Restore the redaction detector's weights, keyed on its model pins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
      - run: uv sync --frozen
        working-directory: apps/worker
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Start one Postgres for the suite's workers
        run: deploy/test-postgres.sh up
      - run: pnpm check:worker
        env:
          TEST_POSTGRES_URI: shared
          # Without this, every run reports each document it builds to a third-party service.
          COCOINDEX_DISABLE_USAGE_TRACKING: "1"

  full-images:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      # Before the builder starts, because it restarts the daemon.
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # The daemon's own builder reads no registry cache unless it stores images in containerd,
      # and the runner's daemon does not.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder does not read the daemon's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check:images
        env:
          IMAGE_PROBE_DEFERRED: ${{ inputs.images-probed-by-the-caller || needs.lane.outputs.images == 'no' }}
          IMAGE_CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}

  # The title becomes the squash commit's subject.
  pr-title:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Read when the step runs, not from the event, so a re-run sees a changed title.
      - name: Check the pull request title with commitlint
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "${PULL_REQUEST}" ]; then
            echo "::error::no pull request number in this event"
            exit 1
          fi
          cli="$(jq -re '.devDependencies["@commitlint/cli"]' package.json)"
          preset="$(jq -re '.devDependencies["@commitlint/config-conventional"]' package.json)"
          title="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}" --jq .title)"
          printf '%s\n' "${title}" |
            pnpm dlx --package="@commitlint/cli@${cli}" --package="@commitlint/config-conventional@${preset}" commitlint

  check:
    needs:
      [
        lane,
        docs-gates,
        full-root,
        full-core,
        full-api,
        full-web-unit,
        full-web-browser,
        full-worker,
        full-images,
        pr-title,
      ]
    # A skipped required check never reports, so this job always runs, whatever the legs did.
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check that every leg in this lane passed and every other leg was skipped
        env:
          LANE: ${{ needs.lane.outputs.lane }}
          LEGS: ${{ toJSON(needs) }}
          TITLE_WANTED: ${{ (github.event_name == 'pull_request') && 'success' || 'skipped' }}
        run: |
          named=0
          required=0
          wrong=""
          for leg in $(printf '%s' "${LEGS}" | jq -r 'keys[]'); do
            named=$((named + 1))
            was="$(printf '%s' "${LEGS}" | jq -r --arg leg "${leg}" '.[$leg].result')"
            case "${leg}" in
              lane) wanted=success ;;
              pr-title) wanted="${TITLE_WANTED}" ;;
              "${LANE}-"*) wanted=success; required=$((required + 1)) ;;
              *) wanted=skipped ;;
            esac
            echo "${leg}: ${was} (this lane wants ${wanted})"
            [ "${was}" = "${wanted}" ] || wrong="${wrong} ${leg}=${was}"
          done
          if [ "${named}" -lt 2 ] || [ "${required}" -lt 1 ]; then
            echo "::error::this verdict read ${named} jobs and required ${required} of them, so it proved nothing. The needs list or the lane names are wrong."
            exit 1
          fi
          if [ -n "${wrong}" ]; then
            echo "::error::check is not green. These jobs ended with the wrong result:${wrong}"
            exit 1
          fi
          echo "the ${LANE} lane is green: ${required} required jobs"
