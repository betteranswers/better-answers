name: check

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      images-probed-by-the-caller:
        description: >-
          Set by a caller whose own job builds the images, loads each one that has a
          contents test and runs that test against the build it is about to push (`T-043`).
          The suites here then leave those tests to that job, so a push to main builds a
          probed image once rather than once on this runner and once on that one. A pull
          request builds no image, has no such job, passes nothing, and probes as usual.
          It reaches every leg whose suites read it — the api's and the worker's — and no
          other; `apps/api/tests/image-job.test.ts` holds that both ways.
        type: boolean
        default: false

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      base: ${{ steps.lane.outputs.base }}
      worker: ${{ steps.lane.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the lane this change runs in
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          case "${EVENT}" in
            pull_request) base="${PULL_REQUEST_BASE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            push | workflow_call) base="${PUSHED_FROM}" ;;
            *) base="" ;;
          esac
          lane=full
          worker=yes
          if [ -n "${base}" ] && [ "${base}" != "0000000000000000000000000000000000000000" ] &&
            git fetch --no-tags --depth=1 origin "${base}" &&
            git diff -z --name-only --no-renames "${base}" HEAD > "${RUNNER_TEMP}/changed-paths"; then
            # Two `key=value` lines, which is the form `$GITHUB_OUTPUT` takes: they are read
            # back here so that an unknown word is refused below rather than published.
            decided="$(node scripts/docs-lane.mjs < "${RUNNER_TEMP}/changed-paths")"
            lane="$(printf '%s\n' "${decided}" | sed -n 's/^lane=//p')"
            worker="$(printf '%s\n' "${decided}" | sed -n 's/^worker=//p')"
          else
            # Three different failures arrive here — no base for this event, a base that
            # could not be fetched, a diff that would not run — and all three mean the same
            # thing downstream, so the notice names the event and the base rather than
            # which of them it was. The base is cleared with them: a leg that filtered
            # against a base this runner could not fetch would be reading nothing.
            echo "::notice::no diff against a base (event ${EVENT}, base '${base}'), so this run takes the full lane"
            base=""
          fi
          # PRE-MERGE CHECKS ARE A SUBSET AND MERGE-TIME CHECKS ARE THE WHOLE, which is the
          # merge queue's own design: a pull request may run the affected lane, and the
          # commit that is about to land runs everything. The lane script answers from the
          # paths alone, so the event's half of the rule is here, beside the base.
          if [ "${lane}" = "affected" ] && [ "${EVENT}" != "pull_request" ]; then
            echo "::notice::a ${EVENT} run takes the full lane, whatever it changed"
            lane=full
          fi
          # Every leg below is gated on these words, so a fourth value is a run whose legs all
          # stand down and whose fan-in has nothing to require — the one way this whole
          # design could be silently green. It is refused here rather than looked for later.
          case "${lane}" in
            docs | affected | full) ;;
            *)
              echo "::error::the lane resolved to '${lane}', which is no lane this workflow has"
              exit 1
              ;;
          esac
          case "${worker}" in
            yes | no) ;;
            *)
              echo "::error::the worker's own gates resolved to '${worker}', which is neither yes nor no"
              exit 1
              ;;
          esac
          echo "this run is in the ${lane} lane, and the worker's gates are in it: ${worker}"
          {
            echo "lane=${lane}"
            echo "base=${base}"
            echo "worker=${worker}"
          } >> "$GITHUB_OUTPUT"

  docs-gates:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs

  full-root:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: the pre-commit hook is installed by install alone
        run: |
          hook="$(git rev-parse --git-path hooks)/pre-commit"
          test -x "$hook" || { echo "no executable pre-commit hook at $hook"; exit 1; }
          grep -q lefthook "$hook" || { echo "$hook is not lefthook's"; exit 1; }
      - run: uv sync --frozen
        working-directory: apps/worker
      - uses: ./.github/actions/git-filter-repo
      - run: pnpm check:tree

  full-api:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: apps/worker/.tool-versions
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: ./.github/actions/git-filter-repo
      - run: pnpm check:api
        env:
          IMAGE_PROBE_DEFERRED: ${{ inputs.images-probed-by-the-caller }}

  full-web:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @better-answers/web exec playwright install --with-deps chromium
      - run: pnpm check:web

  full-worker:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HF_HOME on the runner's own temp directory, not the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - name: the redaction detector's weights, keyed on the pins that name them
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
      - run: uv sync --frozen
        working-directory: apps/worker
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: pnpm check:worker
        env:
          IMAGE_PROBE_DEFERRED: ${{ inputs.images-probed-by-the-caller }}
          COCOINDEX_DISABLE_USAGE_TRACKING: "1"

  affected-gates:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'affected' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:gates

  affected-workspaces:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'affected' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - name: the base the filter reads, and a rename read as both its paths
        env:
          BASE: ${{ needs.lane.outputs.base }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE}"
          git config diff.renames false
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      - uses: ./.github/actions/git-filter-repo
      - run: pnpm --filter @better-answers/web exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: the filter selected something, or the worker's gates did
        env:
          BASE: ${{ needs.lane.outputs.base }}
          WORKER: ${{ needs.lane.outputs.worker }}
        run: |
          selected="$(pnpm --silent check:affected:scope)"
          printf 'the filter selected:\n%s\n' "${selected}"
          if [ -z "${selected}" ] && [ "${WORKER}" != "yes" ]; then
            echo "::error::the affected lane selected no workspace and the worker's gates are not in this change, so only the root gates would have read it"
            exit 1
          fi
      - run: pnpm check:affected
        env:
          BASE: ${{ needs.lane.outputs.base }}
          IMAGE_PROBE_DEFERRED: ${{ inputs.images-probed-by-the-caller }}

  affected-worker:
    needs: lane
    if: ${{ needs.lane.outputs.lane == 'affected' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: whether this change reached the worker at all
        env:
          WORKER: ${{ needs.lane.outputs.worker }}
        run: echo "a path under apps/worker/ or contracts/ changed - ${WORKER}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.lane.outputs.worker == 'yes' }}
      - name: HF_HOME on the runner's own temp directory, not the checkout
        if: ${{ needs.lane.outputs.worker == 'yes' }}
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ needs.lane.outputs.worker == 'yes' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.lane.outputs.worker == 'yes' }}
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ needs.lane.outputs.worker == 'yes' }}
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - name: the redaction detector's weights, keyed on the pins that name them
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ needs.lane.outputs.worker == 'yes' }}
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
      - if: ${{ needs.lane.outputs.worker == 'yes' }}
        run: uv sync --frozen
        working-directory: apps/worker
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: ${{ needs.lane.outputs.worker == 'yes' }}
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        if: ${{ needs.lane.outputs.worker == 'yes' }}
      - if: ${{ needs.lane.outputs.worker == 'yes' }}
        run: pnpm check:worker
        env:
          IMAGE_PROBE_DEFERRED: ${{ inputs.images-probed-by-the-caller }}
          COCOINDEX_DISABLE_USAGE_TRACKING: "1"

  check:
    needs:
      [
        lane,
        docs-gates,
        full-root,
        full-api,
        full-web,
        full-worker,
        affected-gates,
        affected-workspaces,
        affected-worker,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every leg this lane names is green, and every other leg stood down
        env:
          LANE: ${{ needs.lane.outputs.lane }}
          LEGS: ${{ toJSON(needs) }}
        run: |
          named=0
          required=0
          wrong=""
          for leg in $(printf '%s' "${LEGS}" | jq -r 'keys[]'); do
            named=$((named + 1))
            was="$(printf '%s' "${LEGS}" | jq -r --arg leg "${leg}" '.[$leg].result')"
            case "${leg}" in
              lane) wanted=success ;;
              "${LANE}-"*) wanted=success; required=$((required + 1)) ;;
              *) wanted=skipped ;;
            esac
            echo "${leg}: ${was} (this lane wants ${wanted})"
            [ "${was}" = "${wanted}" ] || wrong="${wrong} ${leg}=${was}"
          done
          # A verdict that required nothing of anybody passes whatever happened, which is the
          # one outcome this job exists to refuse. It is a floor, not a count to keep current.
          if [ "${named}" -lt 2 ] || [ "${required}" -lt 1 ]; then
            echo "::error::this verdict read ${named} jobs and required ${required} legs, so it proved nothing"
            exit 1
          fi
          if [ -n "${wrong}" ]; then
            echo "::error::check is not green:${wrong}"
            exit 1
          fi
          echo "the ${LANE} lane is green: ${required} legs"
