name: release

on:
  # build.yml calls this once every image of its commit is pushed.
  workflow_call:
    inputs:
      commit:
        description: "the commit whose sha-<short> images the calling build pushed; released only while it is main's head"
        type: string
        required: true
    # Environment secrets, which a called job reads only when its caller passes their names.
    secrets:
      COOLIFY_DEPLOY_TOKEN:
        required: false
      CF_ACCESS_CLIENT_ID:
        required: false
      CF_ACCESS_CLIENT_SECRET:
        required: false
      # Read by the nightly release alone, which no caller starts.
      HEALTHCHECKS_READ_KEY:
        required: false
      # Read by the journeys and their report, which a called release never runs.
      JOURNEYS_INBOX_KEY:
        required: false
      JOURNEYS_INBOX_URL:
        required: false
      JOURNEYS_ADMIN_EMAIL:
        required: false
      JOURNEYS_EDITOR_EMAIL:
        required: false
      JOURNEYS_VIEWER_EMAIL:
        required: false
      JOURNEYS_PING_URL:
        required: false
  # After the box's 02:00 copy and its 02:05 dump; clear of mutation at 02:17 and scan at 03:41.
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:
    inputs:
      api_digest:
        description: "ghcr.io/…/api digest (sha256:…) — blank = the image of main's head commit (its sha-<short> tag); refused if that commit has none"
        required: false
      worker_digest:
        description: "ghcr.io/…/worker digest (sha256:…) — blank = the image of main's head commit (its sha-<short> tag); refused if that commit has none"
        required: false
      rehearsed_by:
        description: "When RELEASE_MODE is drill: the drill report this release rides on (drills/drill-<stamp>.md), or `hotfix: <reason>`"
        required: false
      journeys_only:
        description: "Run only the journeys, against the live release: nothing is promoted or tagged (RUNBOOK.md page 13)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-production
  cancel-in-progress: false
  # The default keeps one run pending and cancels it when the next arrives, ending its build cancelled.
  queue: max

jobs:
  # It runs inside the group, so main's head is read after every earlier release has finished.
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      promote: ${{ steps.ask.outputs.promote }}
      commit: ${{ steps.ask.outputs.commit }}
      trigger: ${{ steps.ask.outputs.trigger }}
      journeys_only: ${{ steps.ask.outputs.journeys_only }}
      journeys_mode: ${{ steps.ask.outputs.journeys_mode }}
      # Written even when the gate refuses, so a refused night still reaches the report.
      refused: ${{ steps.ask.outputs.refused }}
      refusal: ${{ steps.ask.outputs.refusal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: whether this run releases, and which commit
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
          EVENT: ${{ github.event_name }}
          RELEASE_MODE: ${{ vars.RELEASE_MODE }}
          REHEARSED_BY: ${{ inputs.rehearsed_by }}
          JOURNEYS_MODE: ${{ vars.JOURNEYS_MODE }}
          JOURNEYS_ONLY: ${{ inputs.journeys_only }}
        run: deploy/release-gate.sh

  promote:
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    outputs:
      api_digest: ${{ steps.d.outputs.api }}
      tag: ${{ steps.name.outputs.tag }}
      message: ${{ steps.name.outputs.message }}
      head: ${{ steps.name.outputs.head }}
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PROD_UUID: ${{ vars.COOLIFY_PROD_APP_UUID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      REHEARSED_BY: ${{ inputs.rehearsed_by }}
      TRIGGER: ${{ needs.gate.outputs.trigger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit the gate chose, never main's head as it is now, whose images may not exist yet.
          ref: ${{ needs.gate.outputs.commit || 'main' }}
      - name: the box's own backup is fresh, before a nightly release
        id: backup
        if: needs.gate.outputs.trigger == 'nightly'
        env:
          HEALTHCHECKS_READ_KEY: ${{ secrets.HEALTHCHECKS_READ_KEY }}
        run: |
          set -euo pipefail
          rode="$(deploy/backup-fresh.sh)"
          echo "rode=${rode}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve digests
        id: d
        env:
          IN_API: ${{ inputs.api_digest }}
          IN_WORKER: ${{ inputs.worker_digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Seven characters, which is what `build.yml`'s `type=sha,prefix=sha-` cuts to.
          head="$(git rev-parse HEAD)"
          tag="sha-${head:0:7}"
          # The refusal goes to stderr: inside `$(…)` stdout is the digest.
          last_build() {
            docker buildx imagetools inspect "ghcr.io/${OWNER}/$1:${tag}" --format '{{.Manifest.Digest}}' && return
            echo "::error::main's head ${head} has no ghcr.io/${OWNER}/$1:${tag} — its build is still running, or red. No older image is promoted in its place: wait for that build, dispatch \`build\` on main, or pass the digests" >&2
            return 1
          }
          api="${IN_API:-$(last_build api)}"
          worker="${IN_WORKER:-$(last_build worker)}"
          echo "api=${api}" >> "$GITHUB_OUTPUT"
          echo "worker=${worker}" >> "$GITHUB_OUTPUT"
      - name: each digest is a digest, on its own
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
          WORKER_DIGEST: ${{ steps.d.outputs.worker }}
        run: |
          set -euo pipefail
          for name in API_DIGEST WORKER_DIGEST; do
            value="${!name}"
            if ! [[ "${value}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${name} is not a digest (sha256: followed by 64 hex characters)"
              exit 1
            fi
          done
      - name: set digests and redeploy production
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
          WORKER_DIGEST: ${{ steps.d.outputs.worker }}
        run: deploy/release-redeploy.sh "${API_DIGEST}" "${WORKER_DIGEST}"
      - name: post-deploy smoke against production
        id: smoke
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
        run: |
          set -euo pipefail
          deploy/await-release.sh "${PUBLIC_URL}" "${API_DIGEST}"
          # The uptime check watches this path and /health, so the smoke and the monitor
          # read the same two.
          curl -fsS --retry 5 --retry-delay 6 --retry-all-errors "${PUBLIC_URL}/.well-known/oauth-protected-resource/mcp" | jq -e --arg mcp "${PUBLIC_URL}/mcp" '.resource == $mcp' >/dev/null
      # Named here, where the inputs and digests are, and pushed by the record job, which holds write access.
      - name: name the release's annotated release/<stamp> tag
        id: name
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
          WORKER_DIGEST: ${{ steps.d.outputs.worker }}
          ACTOR: ${{ github.actor }}
          IN_API: ${{ inputs.api_digest }}
          IN_WORKER: ${{ inputs.worker_digest }}
          BACKUP: ${{ steps.backup.outputs.rode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          rode="${REHEARSED_BY:-${BACKUP:-any green build}}"
          case "${TRIGGER}" in
            merge) by="automatic, after the green build of this commit" ;;
            nightly) by="automatic, the nightly release" ;;
            *) by="${ACTOR}" ;;
          esac
          when="$(date -u +%FT%TZ)"
          head="$(git rev-parse HEAD)"
          # A ref name takes no colon; the head makes two runs of one second two tags.
          stamp="${when//[-:]/}-${head:0:7}"
          tag="release/${stamp}"
          # Each digest says for itself whether it was passed or resolved from this head.
          if [ -z "${IN_API}" ] && [ -z "${IN_WORKER}" ]; then
            points="main's head, which both digests were resolved from"
          elif [ -n "${IN_API}" ] && [ -n "${IN_WORKER}" ]; then
            points="main's head at this dispatch — both digests were passed in, so this is not where either image was built"
          elif [ -n "${IN_API}" ]; then
            points="main's head, which the worker digest was resolved from — the api digest was passed in and its image was built elsewhere"
          else
            points="main's head, which the api digest was resolved from — the worker digest was passed in and its image was built elsewhere"
          fi
          if [ "${TRIGGER}" = nightly ]; then
            points="main's newest commit with a green build, which both digests were resolved from"
          fi
          message="$(printf 'release: api %s · worker %s\n\nWhen (UTC): %s\nBy: %s\napi: %s\nworker: %s\nRode on: %s\nCommit: %s (%s)\nRun: %s\n' \
            "${API_DIGEST:7:12}" "${WORKER_DIGEST:7:12}" "${when}" "${by}" "${API_DIGEST}" "${WORKER_DIGEST}" "${rode}" "${head}" "${points}" "${RUN_URL}")"
          # `rehearsed_by` is typed by whoever dispatches, so no fixed line can end the message.
          delimiter="message-$(openssl rand -hex 16)"
          {
            echo "tag=${tag}"
            echo "head=${head}"
            echo "message<<${delimiter}"
            echo "${message}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Promoted to production"
            echo ""
            echo "- \`${head}\` (${points}), to be tagged \`${tag}\`"
            echo "- by ${by}"
            echo "- api \`${API_DIGEST}\`"
            echo "- worker \`${WORKER_DIGEST}\`"
            echo "- rode on: ${rode}"
            echo ""
            echo "The api refuses to start unless PUBLIC_URL, AGENT_HOSTNAME and APEX_HOSTNAME are set on the api resource and all three hostnames differ (ADR 0034)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: say that a failed release recorded no tag
        if: failure()
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          API_DIGEST: ${{ steps.d.outputs.api }}
        run: |
          case "${SMOKE}" in
            failure) said="The smoke failed: production never answered healthy on api \`${API_DIGEST}\`. No \`release/*\` tag was pushed, so the newest tag is still the release that held (RUNBOOK.md page 6)." ;;
            success) said="The smoke passed, but the release's tag could not be named, so no \`release/*\` tag was pushed. Tag it by hand (RUNBOOK.md page 6) only once its journeys held, or while JOURNEYS_MODE is report or off: never a release whose journeys did not hold under gate." ;;
            *) said="The release stopped before its smoke, so no \`release/*\` tag was pushed. Production may still be on the release before it (RUNBOOK.md page 6)." ;;
          esac
          printf '### Not released\n\n%s\n' "${said}" >> "$GITHUB_STEP_SUMMARY"

  # A browser and a package install, kept apart from the write token and from every secret but the journeys' own.
  journeys:
    needs: [gate, promote]
    if: ${{ !cancelled() && needs.gate.outputs.journeys_mode != 'off' && needs.gate.outputs.trigger != 'merge' && (needs.promote.result == 'success' || needs.gate.outputs.journeys_only == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      packages: read
    outputs:
      word: ${{ steps.word.outputs.word }}
      commit: ${{ steps.built.outputs.commit }}
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # build-commit.sh asks whether the image's commit is an ancestor of main.
          fetch-depth: 0
      # A late rerun must not journey a release production no longer runs.
      - name: production answers healthy on the api image under test
        id: live
        env:
          PROMOTED: ${{ needs.promote.outputs.api_digest }}
          AWAIT_RELEASE_POLLS: "3"
        run: |
          set -euo pipefail
          digest="${PROMOTED:-$(curl -sS --max-time 10 "${PUBLIC_URL}/health" | jq -r '.image // empty')}"
          deploy/await-release.sh "${PUBLIC_URL}" "${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      # So a rollback night runs the old commit's journeys against the old images.
      - name: the commit the live api image was built from
        id: built
        env:
          API_DIGEST: ${{ steps.live.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(deploy/build-commit.sh "${API_DIGEST}")"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.built.outputs.commit }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No toolchain cache: an entry another run wrote would reach a job holding the inbox key.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter @better-answers/web...
      - run: pnpm --filter @better-answers/web exec playwright install --with-deps chromium
      # The key and the inbox's address on this step alone, so the install above never sees them.
      - name: the journeys, signed in to production as the test people
        env:
          JOURNEYS_CODE_SOURCE: inbox
          JOURNEYS_SENDER: ${{ vars.JOURNEYS_SENDER }}
          JOURNEYS_INBOX_KEY: ${{ secrets.JOURNEYS_INBOX_KEY }}
          JOURNEYS_INBOX_URL: ${{ secrets.JOURNEYS_INBOX_URL }}
          JOURNEYS_ADMIN_EMAIL: ${{ secrets.JOURNEYS_ADMIN_EMAIL }}
          JOURNEYS_EDITOR_EMAIL: ${{ secrets.JOURNEYS_EDITOR_EMAIL }}
          JOURNEYS_VIEWER_EMAIL: ${{ secrets.JOURNEYS_VIEWER_EMAIL }}
        run: pnpm --filter @better-answers/web run journeys
      - name: the journeys' word
        id: word
        if: always()
        run: |
          word="$(cat apps/web/test-results/journeys-outcome 2>/dev/null || true)"
          case "${word}" in
            held | fail | could-not-run) echo "word=${word}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::the journeys wrote no outcome word, so the report reads could-not-run" ;;
          esac

  record:
    needs: [gate, promote, journeys]
    if: ${{ !cancelled() && needs.promote.result == 'success' && (needs.gate.outputs.trigger == 'merge' || needs.gate.outputs.journeys_mode != 'gate' || needs.journeys.outputs.word == 'held' || needs.journeys.outputs.word == 'fail') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      # Promote's head, so a commit that landed during the journeys is never the one tagged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the job pushes its release tag with this credential
          ref: ${{ needs.promote.outputs.head }}
      - name: production still answers healthy on the promoted api image
        env:
          API_DIGEST: ${{ needs.promote.outputs.api_digest }}
          AWAIT_RELEASE_POLLS: "3"
        run: deploy/await-release.sh "${PUBLIC_URL}" "${API_DIGEST}"
      # Only a release that held is tagged release/; under gate a failed one is tagged rejected/, which the nightly never promotes again.
      - name: record the promotion as an annotated release/<stamp> or rejected/<stamp> tag (the release's last step)
        env:
          TAG: ${{ needs.promote.outputs.tag }}
          MESSAGE: ${{ needs.promote.outputs.message }}
          RELEASE_HEAD: ${{ needs.promote.outputs.head }}
          MODE: ${{ needs.gate.outputs.journeys_mode }}
          TRIGGER: ${{ needs.gate.outputs.trigger }}
          WORD: ${{ needs.journeys.outputs.word }}
          JOURNEYED: ${{ needs.journeys.outputs.commit }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          message="${MESSAGE}"
          if [ -n "${WORD:-}" ]; then
            message="${message}"$'\n'"Journeys: ${WORD}, run against ${JOURNEYED}"
          fi
          heading="Recorded"
          if [ "${MODE}" = gate ] && [ "${TRIGGER}" != merge ] && [ "${WORD:-}" = fail ]; then
            tag="rejected/${TAG#release/}"
            message="rejected: its journeys ended fail, so the nightly release will not promote it again"$'\n\n'"${message}"
            heading="Rejected"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --message "${message}" "${tag}" "${RELEASE_HEAD}"
          git push origin "refs/tags/${tag}"
          {
            echo "### ${heading}"
            echo ""
            echo "- \`${tag}\` on \`${RELEASE_HEAD}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: say that the record job pushed no tag
        if: failure()
        run: |
          said="Its \`release/*\` or \`rejected/*\` tag was not pushed. Tag it by hand (RUNBOOK.md page 6) only once its journeys held, or while JOURNEYS_MODE is report or off: never a release whose journeys did not hold under gate."
          printf '### Not recorded\n\n%s\n' "${said}" >> "$GITHUB_STEP_SUMMARY"

  # Last, whatever the journeys did, so the alert hears from every run that owed it a word.
  report:
    needs: [gate, promote, journeys, record]
    if: ${{ always() && needs.gate.outputs.journeys_mode != 'off' && needs.gate.outputs.trigger != 'merge' && (needs.gate.outputs.promote == 'true' || needs.gate.outputs.journeys_only == 'true' || needs.gate.outputs.refused == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the run's outcome word, pinged to the journeys check
        env:
          WORD: ${{ needs.journeys.outputs.word }}
          JOURNEYS: ${{ needs.journeys.result }}
          PROMOTE: ${{ needs.promote.result }}
          REFUSED: ${{ needs.gate.outputs.refused }}
          REFUSAL: ${{ needs.gate.outputs.refusal }}
          JOURNEYS_PING_URL: ${{ secrets.JOURNEYS_PING_URL }}
        run: deploy/journeys-report.sh
