name: release

on:
  workflow_dispatch:
    inputs:
      api_digest:
        description: "ghcr.io/…/api digest (sha256:…) — blank = the image of main's head commit (its sha-<short> tag); refused if that commit has none"
        required: false
      worker_digest:
        description: "ghcr.io/…/worker digest (sha256:…) — blank = the image of main's head commit (its sha-<short> tag); refused if that commit has none"
        required: false
      rehearsed_by:
        description: "Once CLIENT_DATA_ON_BOX is set: the drill report this release rides on (drills/drill-<stamp>.md), or `hotfix: <reason>`"
        required: false

permissions:
  contents: write
  packages: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PROD_UUID: ${{ vars.COOLIFY_PROD_APP_UUID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      CLIENT_DATA_ON_BOX: ${{ vars.CLIENT_DATA_ON_BOX }}
      REHEARSED_BY: ${{ inputs.rehearsed_by }}
    steps:
      - name: drill-day releases once client data is on the box (Q7)
        run: |
          set -euo pipefail
          if [ -n "${CLIENT_DATA_ON_BOX}" ] && [ -z "${REHEARSED_BY}" ]; then
            echo "::error::CLIENT_DATA_ON_BOX is set (${CLIENT_DATA_ON_BOX}): a release must ride a drill that just proved a restore, or state a hotfix reason — fill \`rehearsed_by\` (RUNBOOK.md page 6)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve digests
        id: d
        env:
          IN_API: ${{ inputs.api_digest }}
          IN_WORKER: ${{ inputs.worker_digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Seven characters, which is what `build.yml`'s `type=sha,prefix=sha-` cuts to.
          head="$(git rev-parse HEAD)"
          tag="sha-${head:0:7}"
          # The refusal goes to stderr: inside `$(…)` stdout is the digest.
          last_build() {
            docker buildx imagetools inspect "ghcr.io/${OWNER}/$1:${tag}" --format '{{.Manifest.Digest}}' && return
            echo "::error::main's head ${head} has no ghcr.io/${OWNER}/$1:${tag} — its build is still running, or red, or the head is a release's own row. No older image is promoted in its place: wait for that build, dispatch \`build\` on main, or pass the digests" >&2
            return 1
          }
          api="${IN_API:-$(last_build api)}"
          worker="${IN_WORKER:-$(last_build worker)}"
          echo "api=${api}" >> "$GITHUB_OUTPUT"
          echo "worker=${worker}" >> "$GITHUB_OUTPUT"
      - name: each digest is a digest, on its own
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
          WORKER_DIGEST: ${{ steps.d.outputs.worker }}
        run: |
          set -euo pipefail
          for name in API_DIGEST WORKER_DIGEST; do
            value="${!name}"
            if ! [[ "${value}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${name} is not a digest (sha256: followed by 64 hex characters)"
              exit 1
            fi
          done
      - name: set digests and redeploy production
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
          WORKER_DIGEST: ${{ steps.d.outputs.worker }}
        run: |
          set -euo pipefail
          patch() {
            jq -cn --arg key "$1" --arg value "$2" '{key: $key, value: $value, is_preview: false}' \
              | curl -fsS -X PATCH "${COOLIFY_URL}/api/v1/applications/${PROD_UUID}/envs" \
                  -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
                  -H "Content-Type: application/json" --data-binary @-
          }
          patch API_IMAGE_DIGEST "${API_DIGEST}"
          patch WORKER_IMAGE_DIGEST "${WORKER_DIGEST}"
          # `-X POST`: Coolify answers a GET on /deploy with 405, hidden behind a 403.
          curl -fsS -X POST "${COOLIFY_URL}/api/v1/deploy?uuid=${PROD_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
      - name: record the promotion in deploy/RELEASES.md
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
          WORKER_DIGEST: ${{ steps.d.outputs.worker }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          rode="${REHEARSED_BY:-pre-client: any green build}"
          # The backticks are the row's markdown and reach the file as themselves.
          # shellcheck disable=SC2016
          printf '| %s | %s | `%s` | `%s` | %s |\n' "$(date -u +%FT%TZ)" "${ACTOR}" "${API_DIGEST}" "${WORKER_DIGEST}" "${rode}" >> deploy/RELEASES.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/RELEASES.md
          git commit -m "release: api ${API_DIGEST:7:12} · worker ${WORKER_DIGEST:7:12}"
          # main may have moved while the reviewer approved: rebase the one commit, then push.
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          {
            echo "### Promoted to production"
            echo ""
            echo "- api \`${API_DIGEST}\`"
            echo "- worker \`${WORKER_DIGEST}\`"
            echo "- rode on: ${rode}"
            echo ""
            echo "The app refuses to start unless PUBLIC_URL, AGENT_HOSTNAME and APEX_HOSTNAME are set on the api resource and all three hostnames differ (ADR 0034)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: post-deploy smoke against production (the release's last step)
        run: |
          set -euo pipefail
          # /deploy is asynchronous and a fresh image takes about three minutes to pull.
          curl -fsS --retry 40 --retry-delay 6 --retry-all-errors -o /dev/null "${PUBLIC_URL}/health"
          # The uptime check watches this path and the one above, so the smoke and the
          # monitor read the same two.
          curl -fsS --retry 5 --retry-delay 6 --retry-all-errors "${PUBLIC_URL}/.well-known/oauth-protected-resource/mcp" | jq -e --arg mcp "${PUBLIC_URL}/mcp" '.resource == $mcp' >/dev/null
