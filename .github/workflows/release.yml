name: release

on:
  # build.yml calls this once every image of its commit is pushed.
  workflow_call:
    inputs:
      commit:
        description: "the commit whose sha-<short> images the calling build pushed; released only while it is main's head"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      api_digest:
        description: "ghcr.io/…/api digest (sha256:…) — blank = the image of main's head commit (its sha-<short> tag); refused if that commit has none"
        required: false
      worker_digest:
        description: "ghcr.io/…/worker digest (sha256:…) — blank = the image of main's head commit (its sha-<short> tag); refused if that commit has none"
        required: false
      rehearsed_by:
        description: "Once PLATFORM_LIVE_SINCE is set: the drill report this release rides on (drills/drill-<stamp>.md), or `hotfix: <reason>`"
        required: false

permissions: {}

concurrency:
  group: release-production
  cancel-in-progress: false
  # The default keeps one run pending and cancels it when the next arrives, ending its build cancelled.
  queue: max

jobs:
  # It runs inside the group, so main's head is read after every earlier release has finished.
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      promote: ${{ steps.ask.outputs.promote }}
    steps:
      - name: a build releases its own commit, while that is main's head and the platform is not live
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
          PLATFORM_LIVE_SINCE: ${{ vars.PLATFORM_LIVE_SINCE }}
          REHEARSED_BY: ${{ inputs.rehearsed_by }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::$1"
            printf '### Not released\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "${COMMIT}" ]; then
            if [ -n "${PLATFORM_LIVE_SINCE}" ] && [ -z "${REHEARSED_BY}" ]; then
              echo "::error::the platform is live (PLATFORM_LIVE_SINCE ${PLATFORM_LIVE_SINCE}): a release must ride a drill that just proved a restore, or state a hotfix reason. Fill \`rehearsed_by\` (RUNBOOK.md page 6)"
              exit 1
            fi
            echo "promote=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit is not a full commit sha (40 hex characters)"
            exit 1
          fi
          if [ -n "${PLATFORM_LIVE_SINCE}" ]; then
            skip "The platform is live (PLATFORM_LIVE_SINCE ${PLATFORM_LIVE_SINCE}), so a green build no longer releases itself. Dispatch \`release\` with \`rehearsed_by\` (RUNBOOK.md page 6)."
          fi
          if ! head="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq .object.sha)"; then
            echo "::error::main's head could not be read, so ${COMMIT} is not released: a newer commit may already be the head"
            exit 1
          fi
          if [ "${head}" != "${COMMIT}" ]; then
            skip "${COMMIT} is no longer main's head; ${head} is. Production never goes back to an older commit, so a newer commit's green build releases in its place."
          fi
          echo "promote=true" >> "$GITHUB_OUTPUT"

  promote:
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
      packages: read
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PROD_UUID: ${{ vars.COOLIFY_PROD_APP_UUID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      REHEARSED_BY: ${{ inputs.rehearsed_by }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the job pushes its release tag with this credential
          # A build's own commit, never main's head as it is now, whose images may not exist yet.
          ref: ${{ inputs.commit || 'main' }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve digests
        id: d
        env:
          IN_API: ${{ inputs.api_digest }}
          IN_WORKER: ${{ inputs.worker_digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Seven characters, which is what `build.yml`'s `type=sha,prefix=sha-` cuts to.
          head="$(git rev-parse HEAD)"
          tag="sha-${head:0:7}"
          # The refusal goes to stderr: inside `$(…)` stdout is the digest.
          last_build() {
            docker buildx imagetools inspect "ghcr.io/${OWNER}/$1:${tag}" --format '{{.Manifest.Digest}}' && return
            echo "::error::main's head ${head} has no ghcr.io/${OWNER}/$1:${tag} — its build is still running, or red. No older image is promoted in its place: wait for that build, dispatch \`build\` on main, or pass the digests" >&2
            return 1
          }
          api="${IN_API:-$(last_build api)}"
          worker="${IN_WORKER:-$(last_build worker)}"
          echo "api=${api}" >> "$GITHUB_OUTPUT"
          echo "worker=${worker}" >> "$GITHUB_OUTPUT"
      - name: each digest is a digest, on its own
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
          WORKER_DIGEST: ${{ steps.d.outputs.worker }}
        run: |
          set -euo pipefail
          for name in API_DIGEST WORKER_DIGEST; do
            value="${!name}"
            if ! [[ "${value}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${name} is not a digest (sha256: followed by 64 hex characters)"
              exit 1
            fi
          done
      - name: set digests and redeploy production
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
          WORKER_DIGEST: ${{ steps.d.outputs.worker }}
        run: |
          set -euo pipefail
          patch() {
            jq -cn --arg key "$1" --arg value "$2" '{key: $key, value: $value, is_preview: false}' \
              | curl -fsS -X PATCH "${COOLIFY_URL}/api/v1/applications/${PROD_UUID}/envs" \
                  -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
                  -H "Content-Type: application/json" --data-binary @-
          }
          patch API_IMAGE_DIGEST "${API_DIGEST}"
          patch WORKER_IMAGE_DIGEST "${WORKER_DIGEST}"
          # `-X POST`: Coolify answers a GET on /deploy with 405, hidden behind a 403.
          curl -fsS -X POST "${COOLIFY_URL}/api/v1/deploy?uuid=${PROD_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
      - name: record the promotion as an annotated release/<stamp> tag
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
          WORKER_DIGEST: ${{ steps.d.outputs.worker }}
          ACTOR: ${{ github.actor }}
          IN_API: ${{ inputs.api_digest }}
          IN_WORKER: ${{ inputs.worker_digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          rode="${REHEARSED_BY:-before go-live: any green build}"
          by="${ACTOR}"
          if [ -n "${COMMIT}" ]; then
            by="automatic, after the green build of this commit"
          fi
          when="$(date -u +%FT%TZ)"
          head="$(git rev-parse HEAD)"
          # A ref name takes no colon; the head makes two runs of one second two tags.
          stamp="${when//[-:]/}-${head:0:7}"
          tag="release/${stamp}"
          # Each digest says for itself whether it was passed or resolved from this head.
          if [ -z "${IN_API}" ] && [ -z "${IN_WORKER}" ]; then
            points="main's head, which both digests were resolved from"
          elif [ -n "${IN_API}" ] && [ -n "${IN_WORKER}" ]; then
            points="main's head at this dispatch — both digests were passed in, so this is not where either image was built"
          elif [ -n "${IN_API}" ]; then
            points="main's head, which the worker digest was resolved from — the api digest was passed in and its image was built elsewhere"
          else
            points="main's head, which the api digest was resolved from — the worker digest was passed in and its image was built elsewhere"
          fi
          # The tag is pushed before the smoke, so only its run says whether this release held.
          message="$(printf 'release: api %s · worker %s\n\nWhen (UTC): %s\nBy: %s\napi: %s\nworker: %s\nRode on: %s\nCommit: %s (%s)\nRun: %s\n' \
            "${API_DIGEST:7:12}" "${WORKER_DIGEST:7:12}" "${when}" "${by}" "${API_DIGEST}" "${WORKER_DIGEST}" "${rode}" "${head}" "${points}" "${RUN_URL}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --message "${message}" "${tag}" "${head}"
          git push origin "refs/tags/${tag}"
          {
            echo "### Promoted to production"
            echo ""
            echo "- recorded as \`${tag}\` on \`${head}\` (${points})"
            echo "- by ${by}"
            echo "- api \`${API_DIGEST}\`"
            echo "- worker \`${WORKER_DIGEST}\`"
            echo "- rode on: ${rode}"
            echo ""
            echo "The api refuses to start unless PUBLIC_URL, AGENT_HOSTNAME and APEX_HOSTNAME are set on the api resource and all three hostnames differ (ADR 0034)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: post-deploy smoke against production (the release's last step)
        env:
          API_DIGEST: ${{ steps.d.outputs.api }}
        run: |
          set -euo pipefail
          deploy/await-release.sh "${PUBLIC_URL}" "${API_DIGEST}"
          # The uptime check watches this path and /health, so the smoke and the monitor
          # read the same two.
          curl -fsS --retry 5 --retry-delay 6 --retry-all-errors "${PUBLIC_URL}/.well-known/oauth-protected-resource/mcp" | jq -e --arg mcp "${PUBLIC_URL}/mcp" '.resource == $mcp' >/dev/null
