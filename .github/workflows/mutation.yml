# Mutation testing on a schedule: Stryker for apps/api and packages/core.
# WEEKLY on hosted runners, not nightly: a nightly run is ~1,800 of the 2,000 free minutes on a 2-vCPU runner
# (ticket 41 Q1, research 69). Nightly returns with a self-hosted runner on VPC 2 — a one-line runs-on change.
# A falling score is an ordna task, not a failed build — the job posts the numbers, it does not gate.
# Stryker does not exit non-zero on a survivor here (thresholds.break is null in both configs), so a red
# job means the harness itself broke, which is worth seeing.
#
# TWO LEGS, AND WHAT WOULD BRING A THIRD BACK. A score is only worth reporting where the tests that
# produce it exercise the code being mutated, which is what removed the other two:
#   - apps/web. Its primary test interface is a browser — Playwright against a served build — and
#     Stryker's Vitest runner cannot drive it. What is left for the runner is three jsdom files
#     against a dozen components, so the score would be dominated by mutants no test covers and
#     would move when jsdom coverage moved while staying blind to the suite that exercises the SPA.
#     It comes back when a runner can drive the browser suite, or when component tests through
#     Testing Library cover the screens on their own. `apps/web/stryker.config.mjs` went with it.
#   - apps/worker. Its mutatable source is a few dozen lines of configuration and logging plus a
#     schema view generated from the migration journal, so a mutmut score today measures the
#     generator. It comes back with `T-006`, which is where the worker gets behaviour worth
#     mutating; the tier keeps mutmut and its settings in `apps/worker/pyproject.toml` ready for it.
#
# Action versions read from each action's GitHub releases page on 31/08/2026, resolved to the
# commit SHA each tag names on 03/09/2026 (`T-040`; the reason is in check.yml's header).
# actions/cache read from https://github.com/actions/cache/releases/tag/v6.1.0 on 07/09/2026 and
# resolved the same day; `restore` and `save` are directories inside that repository, so the two
# carry the one commit its v6.1.0 tag names.
name: mutation

on:
  schedule:
    - cron: "17 2 * * 0"   # Sundays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `name` labels the job, the summary and the artifact; `path` is the workspace. They
        # differ because an artifact name may not carry a slash (ADR 0029 moved the tiers
        # under `apps/`).
        include:
          - name: api
            path: apps/api
          - name: core
            path: packages/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Last week's mutant results — or, after an overrun, the cancelled leg's own — so a file
      # nobody touched is not re-tested. Every mutant costs a Postgres container start, which is
      # what makes this worth a cache step at all.
      # A cache entry is written once and never overwritten, so a fixed key would pin the first
      # week's results forever: the run id makes the key new every time — so the entry is always
      # saved — and the prefix restores the newest one this workspace has. A week where nothing
      # restores (a first run, or GitHub evicting an entry it has not seen read for seven days,
      # which a weekly schedule sits exactly on) is a full run: slower, never wrong.
      # Restore and save are separate steps because the combined action saves in a post step
      # conditioned on success, which discards the checkpoint of the one run that needed to keep
      # it — a leg cancelled at the job timeout. Split, the save below carries `always()` and an
      # overrunning leg becomes next Sunday's starting point instead of next Sunday's full run.
      - name: last week's mutant results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The path is the workspace's `incrementalFile`, which is where the reason for it
          # sitting under `reports/` rather than under the run's temp directory is written.
          path: ${{ matrix.path }}/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: stryker-incremental-${{ matrix.name }}-
      # Cancellation signals the step's entry process and nothing under it, and a shell waiting on
      # a child forwards no signal: behind `pnpm run mutation` Stryker was a grandchild, died
      # unsignalled (run 34128668967) and so never wrote the partial incremental report it writes
      # when it catches SIGINT or SIGTERM. `exec` hands the entry process to pnpm's bin shim,
      # which execs into node — one process from the step down, so the runner's SIGINT is
      # Stryker's. The workspace's `mutation` script is skipped rather than called because calling
      # it is what interposed the shell; `stryker.config.mjs` holds the run's settings either way.
      - name: mutation
        working-directory: ${{ matrix.path }}
        run: exec node_modules/.bin/stryker run
      # First of the `always()` steps because a cancelled job has about five minutes before the
      # runner kills everything, and the checkpoint is the one artefact the next run needs.
      - name: this run's mutant results, whether or not it finished
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.path }}/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ matrix.name }}-${{ github.run_id }}
      - name: score to the job summary
        if: always()
        run: |
          f=${{ matrix.path }}/reports/mutation/mutation.json
          if [ -f "$f" ]; then
            # The report holds one entry per mutant, not a score; the score is the share of
            # mutants a test caught, which is what a reader of the summary wants.
            jq -r --arg w "${{ matrix.name }}" '
              [.files[].mutants[].status] as $s
              | ($s | map(select(. == "Killed" or . == "Timeout")) | length) as $killed
              | ($s | map(select(. == "Killed" or . == "Timeout" or . == "Survived" or . == "NoCoverage")) | length) as $total
              | if $total == 0
                then "### \($w) mutation score: no mutants"
                else "### \($w) mutation score: \(($killed * 1000 / $total | round) / 10)% (\($killed)/\($total) mutants killed)"
                end' "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.name }} mutation score: no report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-${{ matrix.name }}
          path: ${{ matrix.path }}/reports/mutation/mutation.json
          retention-days: 14
