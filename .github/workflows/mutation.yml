name: mutation

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-test every mutant (stryker --force); off reuses the previous run's results"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            path: apps/api
          - name: core
            path: packages/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/worker
      - uses: ./.github/actions/git-filter-repo
      # Split, because the combined action saves only on success and so discards a
      # cancelled leg's checkpoint.
      - name: the previous run's mutant results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.path }}/reports/mutation/stryker-incremental.json
          # An entry is written once, so the run id keeps the key new and the prefix restores.
          key: stryker-incremental-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stryker-incremental-${{ matrix.name }}-
      - name: the previous run's report, kept as the summary's baseline
        run: |
          f=${{ matrix.path }}/reports/mutation/stryker-incremental.json
          if [ -f "$f" ]; then cp "$f" "${{ matrix.path }}/reports/mutation/baseline.json"; fi
      # `exec` leaves one process from the step down, so cancellation reaches Stryker.
      - name: mutation
        working-directory: ${{ matrix.path }}
        run: exec node_modules/.bin/stryker run ${{ inputs.force && '--force' || '' }}
      - name: this run's mutant results, whether or not it finished
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.path }}/reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: score and new survivors to the job summary
        if: always()
        run: |
          node scripts/mutation-summary.mjs --leg ${{ matrix.name }} \
            --report ${{ matrix.path }}/reports/mutation/mutation.json \
            --baseline ${{ matrix.path }}/reports/mutation/baseline.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-${{ matrix.name }}
          path: ${{ matrix.path }}/reports/mutation/mutation.json
          retention-days: 14
