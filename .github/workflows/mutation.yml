# Mutation testing on a schedule ([TEST6]): Stryker for apps/api and apps/web, mutmut for apps/worker.
# WEEKLY on hosted runners, not nightly: a nightly run is ~1,800 of the 2,000 free minutes on a 2-vCPU runner
# (ticket 41 Q1, research 69). Nightly returns with a self-hosted runner on VPC 2 — a one-line runs-on change.
# A falling score is an ordna task, not a failed build — the job posts the numbers, it does not gate.
# Neither tool exits non-zero on a survivor here (Stryker's thresholds.break is null, mutmut's run always
# exits 0), so a red job means the harness itself broke, which is worth seeing.
# Action versions read from each action's GitHub releases page on 31/08/2026 ([DEPS1]).
name: mutation

on:
  schedule:
    - cron: "17 2 * * 0"   # Sundays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # `name` labels the job, the summary and the artifact; `path` is the workspace. They
        # differ because an artifact name may not carry a slash (ADR 0029 moved the tiers
        # under `apps/`).
        include:
          - name: api
            path: apps/api
          - name: web
            path: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./${{ matrix.path }} run mutation
      - name: score to the job summary
        if: always()
        run: |
          f=${{ matrix.path }}/reports/mutation/mutation.json
          if [ -f "$f" ]; then
            # The report holds one entry per mutant, not a score; the score is the share of
            # mutants a test caught, which is what a reader of the summary wants.
            jq -r --arg w "${{ matrix.name }}" '
              [.files[].mutants[].status] as $s
              | ($s | map(select(. == "Killed" or . == "Timeout")) | length) as $killed
              | ($s | map(select(. == "Killed" or . == "Timeout" or . == "Survived" or . == "NoCoverage")) | length) as $total
              | if $total == 0
                then "### \($w) mutation score: no mutants"
                else "### \($w) mutation score: \(($killed * 1000 / $total | round) / 10)% (\($killed)/\($total) mutants killed)"
                end' "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.name }} mutation score: no report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: stryker-${{ matrix.name }}
          path: ${{ matrix.path }}/reports/mutation/mutation.json
          retention-days: 14

  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: apps/worker } }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen mutmut run
      - name: survivors to the job summary
        if: always()
        run: |
          {
            echo "### worker mutation survivors"
            echo '```'
            uv run --frozen mutmut results | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
