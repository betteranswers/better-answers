name: mutation

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-test every mutant (stryker --force); off reuses the previous run's results"
        type: boolean
        default: false
      ceiling-minutes:
        description: "Minutes before each shard is cancelled; its checkpoint is kept. Defaults to 180. The maximum is 350, because GitHub ends a hosted job at 360."
        type: number
      shards:
        description: "The shards to run, as leg-number pairs separated by commas with no spaces, such as core-1,api-2. Leave empty to run every shard. A shard that is not named keeps its files' previous results."
        type: string

# Overlapping runs would start from the same checkpoint, and the later upload would win even if it holds fewer results.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  stryker:
    name: stryker (${{ matrix.name }} ${{ matrix.shard }} of ${{ matrix.of }})
    runs-on: ubuntu-26.04
    # A dispatch passes its inputs as strings, and timeout-minutes accepts only a number.
    timeout-minutes: ${{ fromJSON(inputs.ceiling-minutes || '180') }}
    # A job's `if` cannot read the matrix, so every step checks SELECTED, and a shard the dispatch did not name skips them all.
    env:
      SELECTED: ${{ !inputs.shards || contains(format(',{0},', inputs.shards), format(',{0}-{1},', matrix.name, matrix.shard)) }}
    strategy:
      fail-fast: false
      # The plan allows 20 concurrent jobs. This limit leaves room for a run of check.yml, whose jobs mutation-baseline.test.ts counts.
      max-parallel: 6
      matrix:
        include:
          - { name: api, path: apps/api, shard: 1, of: 5 }
          - { name: api, path: apps/api, shard: 2, of: 5 }
          - { name: api, path: apps/api, shard: 3, of: 5 }
          - { name: api, path: apps/api, shard: 4, of: 5 }
          - { name: api, path: apps/api, shard: 5, of: 5 }
          - { name: core, path: packages/core, shard: 1, of: 20 }
          - { name: core, path: packages/core, shard: 2, of: 20 }
          - { name: core, path: packages/core, shard: 3, of: 20 }
          - { name: core, path: packages/core, shard: 4, of: 20 }
          - { name: core, path: packages/core, shard: 5, of: 20 }
          - { name: core, path: packages/core, shard: 6, of: 20 }
          - { name: core, path: packages/core, shard: 7, of: 20 }
          - { name: core, path: packages/core, shard: 8, of: 20 }
          - { name: core, path: packages/core, shard: 9, of: 20 }
          - { name: core, path: packages/core, shard: 10, of: 20 }
          - { name: core, path: packages/core, shard: 11, of: 20 }
          - { name: core, path: packages/core, shard: 12, of: 20 }
          - { name: core, path: packages/core, shard: 13, of: 20 }
          - { name: core, path: packages/core, shard: 14, of: 20 }
          - { name: core, path: packages/core, shard: 15, of: 20 }
          - { name: core, path: packages/core, shard: 16, of: 20 }
          - { name: core, path: packages/core, shard: 17, of: 20 }
          - { name: core, path: packages/core, shard: 18, of: 20 }
          - { name: core, path: packages/core, shard: 19, of: 20 }
          - { name: core, path: packages/core, shard: 20, of: 20 }
    steps:
      # A misnamed shard would run nothing, and the run would pass without testing anything.
      - name: Check the shards the dispatch names
        if: inputs.shards
        env:
          SHARDS: ${{ inputs.shards }}
          LEG: ${{ matrix.name }}
          OF: ${{ matrix.of }}
        run: |
          IFS=, read -ra named <<<"${SHARDS}"
          for shard in "${named[@]}"; do
            if [[ ! "${shard}" =~ ^(api|core)-([1-9][0-9]*)$ ]]; then
              echo "::error::${shard} is not a shard name. Use a leg, a hyphen and a number, separated by commas with no spaces, for example core-1,api-2."
              exit 1
            fi
            if [[ "${BASH_REMATCH[1]}" == "${LEG}" && "${BASH_REMATCH[2]}" -gt "${OF}" ]]; then
              echo "::error::${shard} does not exist: ${LEG} has ${OF} shards."
              exit 1
            fi
          done
      - if: env.SELECTED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.SELECTED == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: env.SELECTED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: env.SELECTED == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - if: env.SELECTED == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.SELECTED == 'true'
        run: uv sync --frozen
        working-directory: apps/worker
      - if: env.SELECTED == 'true'
        uses: ./.github/actions/git-filter-repo
      - if: env.SELECTED == 'true'
        uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # Restores the whole leg's results, not only this shard's, so a file that moves to another shard keeps its results.
      - name: Restore the previous run's mutant results
        if: env.SELECTED == 'true'
        uses: ./.github/actions/mutation-baseline
        with:
          leg: ${{ matrix.name }}
          reports: ${{ matrix.path }}/reports/mutation
      # `exec` replaces the shell with Stryker, so a cancellation signal reaches Stryker.
      - name: Run Stryker on this shard
        if: env.SELECTED == 'true'
        working-directory: ${{ matrix.path }}
        env:
          LEG: ${{ matrix.name }}
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
        run: |
          slice="$(node ../../scripts/mutation-shards.mjs slice --leg "${LEG}" --shard "${SHARD}" --of "${OF}" \
            --baseline reports/mutation/baseline.json)"
          exec node_modules/.bin/stryker run --mutate "${slice}" ${{ inputs.force && '--force' || '' }}
      # Named after the shard, so the leg's summary job can gather every shard into one directory.
      - name: Collect this shard's mutant results, whether or not it finished
        if: always() && env.SELECTED == 'true'
        env:
          REPORTS: ${{ matrix.path }}/reports/mutation
          SHARD: ${{ matrix.shard }}
          GATHERED: ${{ runner.temp }}/shard
        run: |
          mkdir -p "${GATHERED}"
          if [ -f "${REPORTS}/stryker-incremental.json" ]; then
            cp "${REPORTS}/stryker-incremental.json" "${GATHERED}/${SHARD}.checkpoint.json"
          fi
          if [ -f "${REPORTS}/mutation.json" ]; then
            cp "${REPORTS}/mutation.json" "${GATHERED}/${SHARD}.report.json"
          fi
      - if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-shard-${{ matrix.name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/
          retention-days: 1
          # A re-run keeps the run id, so an artifact from the first attempt may already have this name.
          overwrite: true

  summary:
    name: summary (${{ matrix.name }})
    needs: stryker
    # A shard cancelled at its ceiling still leaves a checkpoint, and the leg's results must carry it forward.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, of: 5 }
          - { name: core, of: 20 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore the previous run's mutant results
        uses: ./.github/actions/mutation-baseline
        with:
          leg: ${{ matrix.name }}
          reports: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stryker-shard-${{ matrix.name }}-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - id: merge
        name: Merge the shards' results into the leg's
        env:
          LEG: ${{ matrix.name }}
          OF: ${{ matrix.of }}
        run: |
          node scripts/mutation-shards.mjs merge --leg "${LEG}" --of "${OF}" \
            --shards "${RUNNER_TEMP}/shards" \
            --baseline "${RUNNER_TEMP}/baseline/baseline.json" \
            --out "${RUNNER_TEMP}/merged" >> "${GITHUB_STEP_SUMMARY}"
      # Fails when the runner ran no test for a mutant or killed none: that is a broken runner, not a low score.
      - name: Write the score and new survivors to the job summary
        env:
          LEG: ${{ matrix.name }}
        run: |
          node scripts/mutation-summary.mjs --leg "${LEG}" \
            --report "${RUNNER_TEMP}/merged/mutation.json" \
            --checkpoint "${RUNNER_TEMP}/merged/stryker-incremental.json" \
            --baseline "${RUNNER_TEMP}/baseline/baseline.json" >> "${GITHUB_STEP_SUMMARY}"
      # Skipped after a failed merge, which would upload nothing newer than what the restore read.
      - name: Upload the leg's mutant results for the next run
        if: always() && steps.merge.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-incremental-${{ matrix.name }}
          path: ${{ runner.temp }}/merged/stryker-incremental.json
          retention-days: 14
          overwrite: true
