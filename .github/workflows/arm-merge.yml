name: arm-merge

# Arms a pull request's merge once Cubic has finished with its head, and disarms it when a push
# moves the head, so the queue never takes a head Cubic has not read. The main ruleset's
# review-thread rule then holds the merge until every Cubic thread is resolved.
# docs/agents/workflow.md, *Merging*, says why.

on:
  check_run:
    types: [completed]
  pull_request:
    types: [synchronize]

# One head at a time, in the order its events arrived: a push's disarm runs before the arm that
# Cubic's check on the same head triggers.
concurrency:
  group: arm-merge-${{ github.event.check_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  arm:
    if: github.event_name == 'check_run' && github.event.check_run.app.slug == 'cubic-dev-ai'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: each open pull request at this head armed
        env:
          # A merge armed with GITHUB_TOKEN starts no workflow, so the queue's `check` would never run.
          GH_TOKEN: ${{ secrets.ARM_MERGE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          OPEN_BY_A_PERSON: >-
            .[] | select(.state == "open" and (.draft | not) and .head.sha == $ENV.HEAD_SHA
            and (.user.login | endswith("[bot]") | not)) | .number
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::the ARM_MERGE_TOKEN secret is not set, so nothing is armed; arm by hand with gh pr merge <n> --auto --merge"
            exit 1
          fi
          numbers="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq "${OPEN_BY_A_PERSON}")"
          if [ -z "${numbers}" ]; then
            echo "no open pull request by a person has ${HEAD_SHA} as its head"
            exit 0
          fi
          for number in ${numbers}; do
            gh pr merge "${number}" --repo "${REPOSITORY}" --auto --merge
            echo "armed #${number} at ${HEAD_SHA}"
          done

  disarm:
    if: github.event_name == 'pull_request' && github.event.pull_request.auto_merge != null
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: the moved head's merge disarmed until Cubic reads it
        env:
          GH_TOKEN: ${{ secrets.ARM_MERGE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "${NUMBER}" --repo "${REPOSITORY}" --disable-auto
          echo "disarmed #${NUMBER}; Cubic's check on the new head arms it again"
