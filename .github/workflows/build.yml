# Build the two tier images on main, push to ghcr.io, and redeploy STAGING by digest.
# Production is promoted by a person — release.yml. Tags are labels for people; the digest is the deploy variable.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - tier: app
            context: .
            dockerfile: app/Dockerfile
          - tier: worker
            context: worker
            dockerfile: worker/Dockerfile
    outputs:
      app_digest: ${{ steps.out.outputs.app_digest }}
      worker_digest: ${{ steps.out.outputs.worker_digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v7.3.0
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: out
        run: echo "${{ matrix.tier }}_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  staging:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      # Coolify deploy API: set the two digest env vars on the staging stack, then trigger a redeploy.
      # Endpoint shapes: research/41-deploy-facts.md §2(b); COOLIFY_URL is the VPC 2 Coolify (behind Access — an Access service token pair for CI is the wizard's step 6).
      - name: set digests and redeploy staging
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          # Coolify sits behind Cloudflare Access; CI presents a service token pair (deploy/coolify.md § Stage 7 state).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          APP_UUID: ${{ vars.COOLIFY_STAGING_APP_UUID }}
          APP_DIGEST: ${{ needs.image.outputs.app_digest }}
          WORKER_DIGEST: ${{ needs.image.outputs.worker_digest }}
        run: |
          set -euo pipefail
          for kv in "APP_IMAGE_DIGEST=$APP_DIGEST" "WORKER_IMAGE_DIGEST=$WORKER_DIGEST"; do
            curl -fsS -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID/envs" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Content-Type: application/json" \
              -d "{\"key\":\"${kv%%=*}\",\"value\":\"${kv#*=}\",\"is_preview\":false}"
          done
          curl -fsS "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false" -H "Authorization: Bearer $COOLIFY_TOKEN" -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
