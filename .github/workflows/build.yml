name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A pull request's cache entries sit under its own ref, which no other run reads, so
  # `check.yml`'s legs only restore the detector's weights; this job writes them on main, where
  # every ref reads them. It holds no token that publishes, and nothing here ships.
  # A failure here leaves the run green, which the nightly release reads; the next push retries.
  caches:
    continue-on-error: true
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `check.yml` restores this path and key; the pins hashed name the models.
      - name: whether main already holds the detector's weights
        id: weights
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
          lookup-only: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Saves the store only when main holds no entry for this lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.node.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        id: uv
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - if: steps.uv.outputs.cache-hit != 'true' || steps.weights.outputs.cache-hit != 'true'
        run: uv sync --frozen
        working-directory: apps/worker
      - if: steps.weights.outputs.cache-hit != 'true'
        name: HF_HOME on the runner's own temp directory, not the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      # The image's own fetch: loading each pinned model also fetches the encoder it names.
      - if: steps.weights.outputs.cache-hit != 'true'
        name: the detector's weights, fetched as the worker image fetches them
        run: uv run --frozen python -c 'from better_answers_worker.redaction.weights import fetch; fetch()'
        working-directory: apps/worker
      - if: steps.weights.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}

  check:
    # Replacing the workflow's grant, this must cover every called job, though some never run on a
    # push, or the run fails at startup.
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/check.yml
    with:
      images-probed-by-the-caller: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  image:
    needs: check
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: api
            context: .
            dockerfile: apps/api/Dockerfile
            probe: pnpm --filter @better-answers/api run images tests/images/image.test.ts
            probe-toolchain: node
          - tier: worker
            context: apps/worker
            dockerfile: apps/worker/Dockerfile
            probe: uv run --frozen --only-group probe --directory apps/worker pytest tests/test_image.py
            probe-toolchain: python
          - tier: backup
            context: deploy
            dockerfile: deploy/backup.Dockerfile
            probe: pnpm --filter @better-answers/api run images tests/images/backup-image.test.ts
            probe-toolchain: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job holds `packages: write` and then runs three Dockerfiles.
          persist-credentials: false
      # Before the builder starts, because it restarts the daemon.
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # The default `docker` driver cannot export a cache, so `cache-to` fails the build.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder does not read the daemon's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          tags: |
            type=sha,prefix=sha-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.probe-toolchain == 'node'
      # No toolchain cache here: an entry another run wrote would reach a job that pushes images.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.probe-toolchain == 'node'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: matrix.probe-toolchain == 'node'
        run: pnpm install --frozen-lockfile --filter @better-answers/api...
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: matrix.probe-toolchain == 'python'
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: false
      - if: matrix.probe-toolchain == 'python'
        run: uv sync --frozen --only-group probe
        working-directory: apps/worker
      # The leg's one build. A second build for the push could re-run a step BuildKit's cache
      # missed, and the weights and suffix list steps fetch afresh, so it would ship bytes
      # the probe never read.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: load
        if: matrix.probe
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=docker,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # In the registry, not the Actions cache, which any run on main can write: these
          # layers ship, and only a job holding `packages: write` can write here. A failed
          # export warns rather than fails, so a refused cache never stops a built image
          # from being probed and pushed. Only a run on main writes the tag, because a branch run
          # that did would decide which layers main's next build reads and ships; it still reads.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', github.repository_owner, matrix.tier) || '' }}
      # With no id the probe would build an image of its own, and the leg would push
      # something nothing read.
      - name: the image is read before it ships
        if: matrix.probe
        env:
          IMAGE_ID: ${{ steps.load.outputs.imageid }}
          PROBE: ${{ matrix.probe }}
        run: |
          if [ -z "${IMAGE_ID}" ]; then
            echo "::error::the load reported no image id, so there is no built image to probe"
            exit 1
          fi
          ${PROBE}
      # The daemon keeps images in containerd, which pushes the manifest the load wrote
      # byte for byte. The digest is read back from the registry, not from the runner.
      - name: the image the probe read is the image pushed
        id: push
        env:
          LOADED: ${{ steps.load.outputs.imageid }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          if [ -z "${LOADED}" ]; then
            echo "::error::no image was built and probed, so there is nothing to push: a leg ships only the image its probe read"
            exit 1
          fi
          if ! docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1; then
            echo "::error::the daemon does not keep images in containerd, so a push would write a manifest the probe never read"
            exit 1
          fi
          docker push --quiet --all-tags "${IMAGE}"
          digest="$(docker buildx imagetools inspect "${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: digest to the job summary
        env:
          TIER: ${{ matrix.tier }}
          OWNER: ${{ github.repository_owner }}
          PROBE: ${{ matrix.probe }}
          PROBED: ${{ steps.load.outputs.digest }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${TIER}"
            echo ""
            echo "\`ghcr.io/${OWNER}/${TIER}@${PUSHED}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Keyed on whether the leg was probed, or a missing digest would drop the claim.
          if [ -n "${PROBE}" ]; then
            if [ -z "${PROBED}" ]; then
              echo "::error::${TIER} was probed but its load reported no digest, so this run cannot say what was tested"
              exit 1
            fi
            {
              echo ""
              echo "tested \`${PROBED}\`, pushed \`${PUSHED}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${PROBED}" != "${PUSHED}" ]; then
              echo "::error::${TIER} probed ${PROBED} and the registry answers ${PUSHED}: the push did not ship the manifest the probe read"
              exit 1
            fi
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && github.ref == 'refs/heads/main' }}
    # Exactly release.yml's asks: the tag, the digests, and the nightly release's reading of runs.
    permissions:
      contents: write
      packages: read
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      commit: ${{ github.sha }}
    # Empty here, being the production environment's: passing each name is what lets the called
    # job that names that environment read it.
    secrets:
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
