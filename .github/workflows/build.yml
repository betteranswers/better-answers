# Build the tier images on main and push them to ghcr.io. Nothing here deploys.
# Tags are labels for people; the DIGEST is the deploy variable (ADR 0022) — the
# platform compose file refuses to start without one. Staging is brought up by the drill
# procedure (`T-005`); production is promoted by a person (release.yml).
#
# THE IMAGE LIST, and it is stated once:
#   api     — apps/api/Dockerfile, built from the repository root (it carries apps/web's build)
#   worker  — apps/worker/Dockerfile, built from apps/worker
#   backup  — deploy/backup.Dockerfile, built from deploy/ (T-005; ticket 79 A11)
# The first two are `deploy/platform.compose.yaml`'s names by digest, promoted by release.yml;
# the third is `deploy/stores.compose.yaml`'s, set in that resource's env by hand at the first
# deploy and whenever the backup image changes — the stores stack is not the deploy unit.
# Postgres is never built here and never will be: it is the official pgvector image, pinned by
# digest in `packages/schema/src/postgres-image.ts` (ADR 0032).
#
# EVERY COMMIT GETS ITS IMAGE (`T-211`). A run's concurrency group is its own commit, so runs
# neither queue behind nor cancel each other, and the one tag a run writes is that commit's
# `sha-<short>` — a name no other run writes. There is no `:main` tag: with nothing serialising
# the runs it would end on whichever finished last. `release.yml` resolves the head of `main`
# by its `sha-` tag and refuses when that commit has no image yet. Until 20/09/2026 the group
# was `build-main`, and GitHub holds one running and one pending run in a group and cancels
# the pending one a third displaces: a burst of pushes built its first and its last, and 6 of
# 20 runs were cancelled within seconds of being created.
#
# Action versions read from each repository's latest release on 03/09/2026, and every `uses:`
# names the commit SHA that tag resolved to on the same day (`T-040`) — the reason
# is in check.yml's header, and this is the job that would pay for a moving tag: it holds a
# `packages: write` token. `actions/attest-build-provenance` joined on 20/09/2026, read the
# same way on that day (`T-219`).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Per commit, so the only runs that ever share a group are two dispatches of one commit, and
# the second of those waits rather than racing the first to the same tag. `check.yml`'s own
# group is per commit for a called run for the same reason, and never this one's name.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

# What every job here gets unless it asks for more. `packages: write` is asked for by the one
# job that pushes, below: the narrowing of `check` is then this file's, where it used to rest
# on `check.yml` declaring `contents: read` for itself.
permissions:
  contents: read

jobs:
  # An image is never pushed from a red tree. This is the same `check` every pull request
  # runs, CALLED and not copied, so there is exactly one definition of what `check` is
  # (AGENTS.md: one command, every workspace). `check.yml` has no push trigger of its own for
  # main precisely so a push runs it once — here — rather than twice in two workflows.
  check:
    uses: ./.github/workflows/check.yml
    with:
      # The image job below builds each image once, loads it and runs that image's contents
      # test against the build it is about to push, so the suite called here leaves those
      # tests alone: two builds of one Dockerfile in one run prove the same thing twice, and
      # only one of them is the artefact that ships. A pull request calls `check.yml`
      # without this and probes as usual, because a pull request builds no image.
      images-probed-by-the-caller: true

  image:
    needs: check
    # The last two are the attestation's, at the foot of this job, and no other job's:
    # `id-token` mints the OIDC token a Sigstore signing certificate is asked for with, and
    # `attestations` stores what was signed (`T-219`).
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: api
            context: .
            dockerfile: apps/api/Dockerfile
            # The command that reads this image's contents, run against the build before it
            # is pushed, and the toolchain that command needs before it can run at all.
            # Both are carried in the matrix rather than in a step's condition because a leg
            # is probed by having a test, not by being a particular tier: every step below
            # is gated on what a leg declares, so a fourth image joins by declaring it.
            probe: pnpm --filter @better-answers/api exec vitest run tests/image.test.ts
            probe-toolchain: node
          - tier: worker
            context: apps/worker
            dockerfile: apps/worker/Dockerfile
            # This tier is a uv workspace and not a pnpm one, so its probe is a pytest file
            # in its own suite and its toolchain is uv.
            probe: uv run --frozen --directory apps/worker pytest tests/test_image.py
            probe-toolchain: python
          - tier: backup
            context: deploy
            dockerfile: deploy/backup.Dockerfile
            # A tool image rather than a tier, with no suite of its own, so its probe lives
            # in the api's, beside the text half of the same claim in
            # `apps/api/tests/deploy-tree.test.ts`.
            probe: pnpm --filter @better-answers/api exec vitest run tests/backup-image.test.ts
            probe-toolchain: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job holds `packages: write` and then runs three Dockerfiles and two suites.
          # It never pushes git, so the token is not left in `.git/config` for them to read
          # (`release.yml` does push git, and keeps the default).
          persist-credentials: false
      # Before build-push-action, always: the default `docker` driver cannot export a build
      # cache, so `cache-to: type=gha` fails the build outright with "Cache export is not
      # supported for the docker driver". This step is what gives the job a buildkit driver
      # that can.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        # Seven is the action's default, stated here so that it is this file's number: it is
        # half of an agreement with `release.yml`, and a bump to the action must not move it.
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          # The commit's own tag and no other, cut to the length above, which `release.yml`
          # cuts to as well to find the head of `main` (`apps/api/tests/deploy-tree.test.ts`
          # holds the two to one number).
          tags: |
            type=sha,prefix=sha-
      # The toolchain a probe command runs on, installed for the legs that declare it and
      # for no others. The condition is `matrix.probe-toolchain` and never `matrix.tier`:
      # a step that named an image would turn this job back into a list of images, and a
      # fourth image would then join by editing steps rather than by declaring a probe.
      # `apps/api/tests/image-job.test.ts` holds both halves — a probe whose toolchain
      # nothing installs, and a toolchain installed for a leg with no probe.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: matrix.probe-toolchain == 'node'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.probe-toolchain == 'node'
        with:
          node-version-file: .node-version
          cache: pnpm
      # The workspace every node probe runs in, and what it depends on — that is what the
      # trailing `...` says. A leg runs one test file, and a whole-monorepo install brought the
      # web app and the design system along to run it (`T-211`). The filter is a literal, so
      # `image-job.test.ts` holds it to the workspace the node probes name.
      - if: matrix.probe-toolchain == 'node'
        run: pnpm install --frozen-lockfile --filter @better-answers/api...
      # The worker's probe is a pytest file, so its leg brings uv. Same action and same
      # commit as `check.yml`'s, and the same `uv sync --frozen` against the same lockfile,
      # because this is the same suite run against one of its files.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: matrix.probe-toolchain == 'python'
        with:
          enable-cache: true
      - if: matrix.probe-toolchain == 'python'
        run: uv sync --frozen
        working-directory: apps/worker
      # The build, once, into this runner's daemon and nowhere else. It is exported again
      # below rather than built again: the second call resolves every layer from this
      # builder's own cache, which is what makes the two manifests one manifest.
      #
      # Both exports name the same media types and refuse both attestations, and that is
      # what the summary's claim rests on. Left to itself buildx picks OCI or Docker types
      # per exporter and per what the runner's daemon can load, and a provenance attestation
      # wraps the manifest in an index the loaded image has no counterpart for — either way
      # the digest read here and the digest the registry answers to would be two strings
      # about one build. Labels are passed to both for the same reason: they are the image's
      # own configuration, and a difference there is a difference in the digest.
      #
      # No tags. The probe runs the image by the id this step prints, and an untagged image
      # cannot be confused with another run's.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: load
        if: matrix.probe
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=docker,oci-mediatypes=false
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          # Read only. The cache is exported by the pushing step below, which resolves every
          # layer this one produced; exporting from both would upload one build's cache twice.
          cache-from: type=gha,scope=${{ matrix.tier }}
      # With no id the probe would build an image of its own and read that, and the leg
      # would push something nothing read — so the leg stops here instead.
      - name: the image is read before it ships
        if: matrix.probe
        env:
          IMAGE_ID: ${{ steps.load.outputs.imageid }}
          PROBE: ${{ matrix.probe }}
        run: |
          if [ -z "${IMAGE_ID}" ]; then
            echo "::error::the load reported no image id, so there is no built image to probe"
            exit 1
          fi
          ${PROBE}
      # Every leg pushes on these terms, probed or not. An inline attestation makes the tag
      # point at an index, so the digest a person promotes out of the summary is a wrapper
      # around the image rather than the image. The provenance this job does write is its
      # last step's — a referrer beside the image, which leaves this manifest as it is.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The scope is the leg's name. The backend's default is `buildkit` for everyone and
          # one scope holds one manifest, so three legs sharing it overwrote each other and
          # the worker leg built cold on 47% of runs (`T-211`, measured 20/09/2026). Both
          # tiers' probes pass the same name, so a pull request's build reads what this leg
          # wrote — one way only, an Actions cache being readable from its own ref and from
          # the base branch. `apps/api/tests/image-job.test.ts` refuses a bare `type=gha`; the
          # quota, the scopes and how to read them are `docs/operations/BUILD_CACHE.md`.
          cache-from: type=gha,scope=${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tier }}
      # The digest, in the run's summary, in the form the deploy unit's env var takes — so a
      # person promoting a build copies it from here rather than reading it out of a log. A
      # probed leg says it twice, once from each export, because "tested" is a claim about a
      # particular string of bytes and the summary is where that claim is made.
      #
      # The push has already happened when this compares them, so a difference is a red main
      # rather than a prevented push. That is the most this can be: nothing knows the pushed
      # digest before the push. What it does prevent is the summary saying "tested" about
      # bytes nothing read — the two exports would have stopped being one manifest, and that
      # is a change to this job's terms, not a flake to re-run.
      - name: digest to the job summary
        env:
          TIER: ${{ matrix.tier }}
          OWNER: ${{ github.repository_owner }}
          PROBE: ${{ matrix.probe }}
          PROBED: ${{ steps.load.outputs.digest }}
          PUSHED: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${TIER}"
            echo ""
            echo "\`ghcr.io/${OWNER}/${TIER}@${PUSHED}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Keyed on whether the leg was probed, not on whether a digest came back: a probed
          # leg whose build reported none would otherwise drop the claim and stay green.
          if [ -n "${PROBE}" ]; then
            if [ -z "${PROBED}" ]; then
              echo "::error::${TIER} was probed but its load reported no digest, so this run cannot say what was tested"
              exit 1
            fi
            {
              echo ""
              echo "tested \`${PROBED}\`, pushed \`${PUSHED}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${PROBED}" != "${PUSHED}" ]; then
              echo "::error::${TIER} probed ${PROBED} and pushed ${PUSHED}: the two exports have stopped being one manifest"
              exit 1
            fi
          fi
      # Provenance, by referrer: a signed statement of which workflow run built this digest,
      # written into the registry BESIDE the image and keyed by the digest the push reported.
      # This is not the `provenance` both exports refuse. That one is inline — it wraps the
      # manifest in an index, so the tag, and the digest a person promotes, would name the
      # wrapper. This one leaves the manifest and its digest exactly as the push left them
      # (ADR 0022: the digest is the deploy variable). In each package it shows as a
      # `sha256-<digest>` tag; `release.yml` resolves `sha-<short>` and never reads it.
      #
      # Last, and only on a leg that got this far: the summary has already said what was
      # tested and pushed, and a digest the comparison above refused is not attested.
      #
      # WHEN IT FAILS the leg is red and `main` is red, with the image already pushed and
      # promotable behind it — `release.yml` reads the registry, not this run's conclusion.
      # That is decided, not tolerated (`T-219`): swallowed, a digest with no attestation
      # would look to a verifier exactly like a digest something else pushed, and the day
      # verification starts is the day that difference has to mean something. Nothing
      # verifies yet, so a red here blocks no promotion, and re-running the leg pushes and
      # attests again. The failures to expect are outside the build: Sigstore, or GitHub's
      # attestations API.
      #
      # `create-storage-record` is refused because it asks for a third scope,
      # `artifact-metadata: write`, to list the image on the organisation's linked-artifacts
      # page — and without that scope it warns twice on every leg rather than failing.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
