name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  already-checked:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      verdict: ${{ steps.ask.outputs.verdict }}
    steps:
      - name: a successful merge-group run of check for this commit
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          verdict=no
          # The query filters and the jq filters again on the two fields that need no
          # interpolation; the head sha is compared in the shell, so nothing this run did
          # not put there is ever spliced into a jq program.
          if heads="$(gh api --method GET \
            "repos/${REPOSITORY}/actions/workflows/check.yml/runs" \
            -f "head_sha=${COMMIT}" -f event=merge_group -f status=success \
            --jq '[.workflow_runs[] | select(.event == "merge_group" and .conclusion == "success") | .head_sha] | join(" ")')"; then
            case " ${heads} " in
              *" ${COMMIT} "*) verdict=yes ;;
            esac
          else
            echo "::notice::the workflow-runs API did not answer, so this commit is checked here"
          fi
          echo "already checked by the merge queue: ${verdict} (${COMMIT})"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"

  check:
    needs: already-checked
    if: ${{ !cancelled() && needs.already-checked.outputs.verdict != 'yes' }}
    uses: ./.github/workflows/check.yml
    with:
      images-probed-by-the-caller: true

  image:
    needs: [already-checked, check]
    if: >-
      ${{ !cancelled()
      && (needs.check.result == 'success'
      || (needs.check.result == 'skipped'
      && needs.already-checked.result == 'success'
      && needs.already-checked.outputs.verdict == 'yes')) }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: api
            context: .
            dockerfile: apps/api/Dockerfile
            probe: pnpm --filter @better-answers/api exec vitest run tests/image.test.ts
            probe-toolchain: node
          - tier: worker
            context: apps/worker
            dockerfile: apps/worker/Dockerfile
            probe: uv run --frozen --directory apps/worker pytest tests/test_image.py
            probe-toolchain: python
          - tier: backup
            context: deploy
            dockerfile: deploy/backup.Dockerfile
            probe: pnpm --filter @better-answers/api exec vitest run tests/backup-image.test.ts
            probe-toolchain: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          tags: |
            type=sha,prefix=sha-
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: matrix.probe-toolchain == 'node'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.probe-toolchain == 'node'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: matrix.probe-toolchain == 'node'
        run: pnpm install --frozen-lockfile --filter @better-answers/api...
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: matrix.probe-toolchain == 'python'
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - if: matrix.probe-toolchain == 'python'
        run: uv sync --frozen
        working-directory: apps/worker
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: load
        if: matrix.probe
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=docker,oci-mediatypes=false
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.tier }}
      - name: the image is read before it ships
        if: matrix.probe
        env:
          IMAGE_ID: ${{ steps.load.outputs.imageid }}
          PROBE: ${{ matrix.probe }}
        run: |
          if [ -z "${IMAGE_ID}" ]; then
            echo "::error::the load reported no image id, so there is no built image to probe"
            exit 1
          fi
          ${PROBE}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tier }}
      - name: digest to the job summary
        env:
          TIER: ${{ matrix.tier }}
          OWNER: ${{ github.repository_owner }}
          PROBE: ${{ matrix.probe }}
          PROBED: ${{ steps.load.outputs.digest }}
          PUSHED: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${TIER}"
            echo ""
            echo "\`ghcr.io/${OWNER}/${TIER}@${PUSHED}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Keyed on whether the leg was probed, not on whether a digest came back: a probed
          # leg whose build reported none would otherwise drop the claim and stay green.
          if [ -n "${PROBE}" ]; then
            if [ -z "${PROBED}" ]; then
              echo "::error::${TIER} was probed but its load reported no digest, so this run cannot say what was tested"
              exit 1
            fi
            {
              echo ""
              echo "tested \`${PROBED}\`, pushed \`${PUSHED}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${PROBED}" != "${PUSHED}" ]; then
              echo "::error::${TIER} probed ${PROBED} and pushed ${PUSHED}: the two exports have stopped being one manifest"
              exit 1
            fi
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
