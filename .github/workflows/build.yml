name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A pull request's cache entries are visible only to its own ref, so `check.yml` only restores
  # the detector's weights, and this job saves them on main, where every ref can read them.
  # It holds no publishing token and ships nothing. A failure leaves the run green, which the
  # nightly release reads; the next push retries.
  caches:
    continue-on-error: true
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `check.yml` restores this path and key; the hashed pins file names the models.
      - name: Check whether main already has the detector's weights cached
        id: weights
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}
          lookup-only: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Saves the pnpm store only when main has no cache entry for this lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.node.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: uv
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: true
      - if: steps.uv.outputs.cache-hit != 'true' || steps.weights.outputs.cache-hit != 'true'
        run: uv sync --frozen
        working-directory: apps/worker
      - if: steps.weights.outputs.cache-hit != 'true'
        name: Put HF_HOME in the runner's temp directory, outside the checkout
        run: echo "HF_HOME=${{ runner.temp }}/huggingface" >> "$GITHUB_ENV"
      # Uses the image's own fetch: loading each pinned model also fetches the encoder it names.
      - if: steps.weights.outputs.cache-hit != 'true'
        name: Fetch the detector's weights the way the worker image does
        run: uv run --frozen python -c 'from better_answers_worker.redaction.weights import fetch; fetch()'
        working-directory: apps/worker
      - if: steps.weights.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/huggingface
          key: hugging-face-${{ runner.os }}-${{ hashFiles('apps/worker/src/better_answers_worker/redaction/pins.py') }}

  check:
    # This replaces the workflow's grant, so it must cover every called job, including jobs that
    # never run on a push, or the run fails at startup.
    permissions:
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/check.yml
    with:
      images-probed-by-the-caller: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  image:
    needs: check
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: api
            context: .
            dockerfile: apps/api/Dockerfile
            probe: pnpm --filter @better-answers/api run images tests/images/image.test.ts
            probe-toolchain: node
          - tier: worker
            context: apps/worker
            dockerfile: apps/worker/Dockerfile
            probe: uv run --frozen --only-group probe --directory apps/worker pytest tests/test_image.py
            probe-toolchain: python
          - tier: backup
            context: deploy
            dockerfile: deploy/backup.Dockerfile
            probe: pnpm --filter @better-answers/api run images tests/images/backup-image.test.ts
            probe-toolchain: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job holds `packages: write` and then runs three Dockerfiles.
          persist-credentials: false
      # Before the builder starts, because it restarts the daemon.
      - uses: ./.github/actions/docker-hub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # The default `docker` driver cannot export a cache, so `cache-to` fails the build.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder does not read the daemon's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          tags: |
            type=sha,prefix=sha-
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.probe-toolchain == 'node'
      # No toolchain cache here: an entry another run wrote would reach a job that pushes images.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.probe-toolchain == 'node'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: matrix.probe-toolchain == 'node'
        run: pnpm install --frozen-lockfile --filter @better-answers/api...
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.probe-toolchain == 'python'
        with:
          version-file: apps/worker/.tool-versions
          enable-cache: false
      - if: matrix.probe-toolchain == 'python'
        run: uv sync --frozen --only-group probe
        working-directory: apps/worker
      # The leg's only build. A second build for the push could re-run a step that missed
      # BuildKit's cache, and the weights and suffix list steps fetch afresh, so it could ship
      # bytes the probe never tested.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: load
        if: matrix.probe
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=docker,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # In the registry, not the Actions cache, which any run on main can write: these
          # layers ship, and only a job with `packages: write` can write here. A failed export
          # warns instead of failing, so a refused cache never blocks probing and pushing. Only a
          # run on main writes the cache tag, so a branch run cannot choose the layers that
          # main's next build ships. Branch runs still read it.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', github.repository_owner, matrix.tier) || '' }}
      # Without an id, the probe would build its own image, and the leg would push an
      # untested one.
      - name: Probe the image before pushing it
        if: matrix.probe
        env:
          IMAGE_ID: ${{ steps.load.outputs.imageid }}
          PROBE: ${{ matrix.probe }}
        run: |
          if [ -z "${IMAGE_ID}" ]; then
            echo "::error::The load step reported no image id, so there is no built image to probe. Read the build step's log."
            exit 1
          fi
          ${PROBE}
      # The daemon keeps images in containerd, which pushes the manifest the load wrote,
      # byte for byte. The digest is read back from the registry, not from the runner.
      - name: Push the probed image and read its digest from the registry
        id: push
        env:
          LOADED: ${{ steps.load.outputs.imageid }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          if [ -z "${LOADED}" ]; then
            echo "::error::No image was built and probed, so there is nothing to push. A leg pushes only the image its probe tested."
            exit 1
          fi
          if ! docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1; then
            echo "::error::The Docker daemon does not store images in containerd, so a push would write a manifest the probe never tested. Enable the containerd image store on the runner."
            exit 1
          fi
          docker push --quiet --all-tags "${IMAGE}"
          digest="$(docker buildx imagetools inspect "${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Write the digest to the job summary
        env:
          TIER: ${{ matrix.tier }}
          OWNER: ${{ github.repository_owner }}
          PROBE: ${{ matrix.probe }}
          PROBED: ${{ steps.load.outputs.digest }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${TIER}"
            echo ""
            echo "\`ghcr.io/${OWNER}/${TIER}@${PUSHED}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Checks whether the leg was probed, so a missing digest fails the step instead of being skipped.
          if [ -n "${PROBE}" ]; then
            if [ -z "${PROBED}" ]; then
              echo "::error::${TIER} was probed, but its load step reported no digest, so this run cannot say which image was tested."
              exit 1
            fi
            {
              echo ""
              echo "tested \`${PROBED}\`, pushed \`${PUSHED}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${PROBED}" != "${PUSHED}" ]; then
              echo "::error::${TIER}: the probe tested ${PROBED}, but the registry has ${PUSHED}. The push did not ship the manifest the probe tested."
              exit 1
            fi
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && github.ref == 'refs/heads/main' }}
    # Exactly what release.yml needs: tag pushes, package reads, and run reads for the nightly release.
    permissions:
      contents: write
      packages: read
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      commit: ${{ github.sha }}
    # These are production environment secrets, empty at this level. Passing each name lets the
    # called job that uses that environment read it.
    secrets:
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
