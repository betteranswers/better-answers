# Build the tier images on main and push them to ghcr.io. Nothing here deploys.
# Tags are labels for people; the DIGEST is the deploy variable (ADR 0022, `[OPS1]`) — the
# platform compose file refuses to start without one. Staging is brought up by the drill
# procedure (`T-005`); production is promoted by a person (release.yml).
#
# THE IMAGE LIST, and it is stated once:
#   api     — apps/api/Dockerfile, built from the repository root (it carries apps/web's build)
#   worker  — apps/worker/Dockerfile, built from apps/worker
# These are the two `deploy/platform.compose.yaml` names by digest. The `backup` image
# (deploy/backup.Dockerfile) is the third and joins this matrix under `T-005`, with the deploy
# unit that runs it. Postgres is never built here and never will be: it is the official
# pgvector image, pinned by digest in `packages/schema/src/postgres-image.ts` (ADR 0032).
#
# Action versions read from each repository's latest release on 03/09/2026 (`[DEPS1]`).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # An image is never pushed from a red tree. This is the same `check` every pull request
  # runs, CALLED and not copied, so there is exactly one definition of what `check` is
  # (AGENTS.md: one command, every workspace). `check.yml` has no push trigger of its own for
  # main precisely so a push runs it once — here — rather than twice in two workflows.
  check:
    uses: ./.github/workflows/check.yml

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: api
            context: .
            dockerfile: apps/api/Dockerfile
          - tier: worker
            context: apps/worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      # Before build-push-action, always: the default `docker` driver cannot export a build
      # cache, so `cache-to: type=gha` fails the build outright with "Cache export is not
      # supported for the docker driver". This step is what gives the job a buildkit driver
      # that can. Its absence is why this workflow had never passed.
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v7.3.0
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The digest, in the run's summary, in the form the deploy unit's env var takes — so a
      # person promoting a build copies it from here rather than reading it out of a log.
      - name: digest to the job summary
        run: |
          {
            echo "### ${{ matrix.tier }}"
            echo ""
            echo "\`ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
