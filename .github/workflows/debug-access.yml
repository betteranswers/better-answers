# TEMPORARY — T-005 release-403 diagnosis, deleted the day it answers.
# Prints status codes and value SHAPES (lengths, prefixes) only; never a value.
name: debug-access

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: shapes and probes
        run: |
          set -uo pipefail
          echo "id_len=${#CF_ACCESS_CLIENT_ID} secret_len=${#CF_ACCESS_CLIENT_SECRET} token_len=${#COOLIFY_TOKEN}"
          case "${COOLIFY_TOKEN}" in Bearer*) echo "token starts with 'Bearer '";; esac
          case "${CF_ACCESS_CLIENT_ID}" in *.access) echo "id ends with .access";; *) echo "id does NOT end with .access";; esac
          probe() { echo "$1 -> $(curl -s -o /dev/null -w '%{http_code}' -m 15 "${@:2}" "${COOLIFY_URL}/api/v1/version")"; }
          probe "pair only" -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          probe "pair + bogus bearer" -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" -H "Authorization: Bearer 1|bogus"
          probe "pair + real bearer" -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          probe "no headers"
          # The release's failing shape: a no-op PATCH of the current digest. Body head and
          # cf-ray identify WHO answers the 405 (a digest is not a secret; envs are never echoed).
          auth=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" -H "Authorization: Bearer ${COOLIFY_TOKEN}")
          digest=$(curl -s "${auth[@]}" "${COOLIFY_URL}/api/v1/applications/${PROD_UUID}/envs" | jq -r '[.[] | select(.key=="API_IMAGE_DIGEST" and (.is_preview|not))][0].value')
          echo "digest read ok: $(echo "${digest}" | grep -cE '^sha256:[0-9a-f]{64}$')"
          jq -cn --arg v "${digest}" '{key:"API_IMAGE_DIGEST", value:$v, is_preview:false}' \
            | curl -s -o /tmp/patch.out -D /tmp/patch.hdr -w "no-op PATCH -> %{http_code}\n" -X PATCH "${auth[@]}" -H "Content-Type: application/json" --data-binary @- "${COOLIFY_URL}/api/v1/applications/${PROD_UUID}/envs"
          grep -i -e "^server:" -e "^cf-ray:" -e "^allow:" /tmp/patch.hdr || true
          head -c 300 /tmp/patch.out; echo
        env:
          PROD_UUID: ${{ vars.COOLIFY_PROD_APP_UUID }}
