name: scan

# Each package's newest `sha-`-tagged version: release tags skip `backup`, and `main`'s head may have no image.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiers:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tiers: ${{ steps.read.outputs.tiers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/build.yml
          sparse-checkout-cone-mode: false
      - name: the tiers build.yml builds an image for
        id: read
        env:
          TIERS: .jobs.image.strategy.matrix.include[].tier
        run: |
          set -euo pipefail
          tiers="$(yq --output-format=json --indent=0 "[${TIERS}]" .github/workflows/build.yml)"
          if ! jq --exit-status 'length > 0 and all(type == "string")' <<<"${tiers}" >/dev/null; then
            echo "::error::build.yml's image job names no tier at ${TIERS} (read ${tiers}), so there is nothing to scan"
            exit 1
          fi
          echo "tiers=${tiers}" >> "$GITHUB_OUTPUT"

  trivy:
    needs: tiers
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(needs.tiers.outputs.tiers) }}
    steps:
      - name: the newest image build.yml pushed for this tier
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TIER: ${{ matrix.tier }}
          # A provenance push lands after its image, tagged `sha256-`, so recency alone picks the signature.
          NEWEST_BUILD: >-
            [.[][] | select(any(.metadata.container.tags[]; test("^sha-[0-9a-f]+$")))]
            | select(length > 0)
            | max_by(.created_at)
            | "\(.name) \([.metadata.container.tags[] | select(test("^sha-[0-9a-f]+$"))] | first)"
        run: |
          set -euo pipefail
          if ! pages="$(gh api --paginate --slurp "orgs/${OWNER}/packages/container/${TIER}/versions?per_page=100")"; then
            echo "::error::the packages API would not list ghcr.io/${OWNER}/${TIER}'s versions to this run's token"
            exit 1
          fi
          read -r digest tag <<<"$(jq --raw-output "${NEWEST_BUILD}" <<<"${pages}")" || true
          if ! [[ "${digest:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ghcr.io/${OWNER}/${TIER} holds no sha- tagged version, so build.yml has pushed nothing here to scan"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "This leg scans \`ghcr.io/${OWNER}/${TIER}@${digest}\`, tagged \`${tag}\`." >> "$GITHUB_STEP_SUMMARY"
      # Keyed by host in the Docker config, so the token is offered to ghcr.io alone, never to the mirror serving the scanner's database.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.tier }}@${{ steps.image.outputs.digest }}
          format: sarif
          output: ${{ matrix.tier }}.sarif
          exit-code: "0"
          # Named, because the action's own default trails the scanner's security releases; Renovate moves this input.
          version: v0.76.1
          # Any run on main can write an Actions cache entry, and a database planted there would hide what this scan reports.
          cache: "false"
          # The worker's layers are 1.47 GB compressed, and the five-minute default spans the pull as well as the scan.
          timeout: 15m
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ matrix.tier }}.sarif
          category: image-${{ matrix.tier }}

  # A cloud session's GitHub calls carry the Claude GitHub App's token, which cannot read code scanning, so the weekly triage reads this branch.
  alerts:
    needs: trivy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      security-events: read
    steps:
      - name: the open alerts and the dismissed ones a fix now closes, on the alerts branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: security/alerts
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHAPE: >-
            {number, created_at, state, severity: .rule.security_severity_level, rule: .rule.id,
            category: .most_recent_instance.category, path: .most_recent_instance.location.path,
            message: .most_recent_instance.message.text, dismissed_comment, url: .html_url}
          # CI.md's dismissed-but-now-fixable query, per alert.
          FIXABLE: >-
            select(.fixed_at == null)
            | select(.most_recent_instance.location.path | test("^[^/]+/[^/]+$|package\\.json$|METADATA$"))
            | select(.most_recent_instance.message.text | test("Fixed Version: \\S"))
        run: |
          set -euo pipefail
          list() { gh api --paginate --slurp "repos/${REPO}/code-scanning/alerts?state=$1&per_page=100"; }
          list open > open.json
          list dismissed > dismissed.json
          jq --null-input --slurpfile open open.json --slurpfile dismissed dismissed.json --arg run "${RUN}" \
            "{run: \$run, open: [\$open[0][][] | ${SHAPE}], fixable: [\$dismissed[0][][] | ${FIXABLE} | ${SHAPE}]}" > alerts.json
          tree="$(jq --null-input --rawfile content alerts.json \
            '{tree: [{path: "alerts.json", mode: "100644", type: "blob", content: $content}]}' \
            | gh api "repos/${REPO}/git/trees" --input - --jq .sha)"
          commit="$(jq --null-input --arg tree "${tree}" --arg message "chore(scan): the alerts as ${RUN} left them" \
            '{message: $message, tree: $tree, parents: []}' \
            | gh api "repos/${REPO}/git/commits" --input - --jq .sha)"
          if gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --silent 2>/dev/null; then
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" -f sha="${commit}" -F force=true --silent
          else
            gh api "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="${commit}" --silent
          fi
          echo "\`${BRANCH}\` holds $(jq '.open | length' alerts.json) open alerts and $(jq '.fixable | length' alerts.json) dismissed ones a fix now closes." >> "$GITHUB_STEP_SUMMARY"
