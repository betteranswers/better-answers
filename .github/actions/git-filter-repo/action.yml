name: git-filter-repo
description: Install git-filter-repo at the version the api image pins, and prove git can reach it.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        pinned="$(sed -n 's/^ARG GIT_FILTER_REPO_VERSION=//p' "$GITHUB_WORKSPACE/apps/api/Dockerfile")"
        # Exactly one, never the first of several: two `ARG` lines are two pins, and a read
        # that quietly picks one of them is the second copy this whole arrangement avoids.
        matches="$(printf '%s\n' "$pinned" | grep -c . || true)"
        if [ "$matches" != 1 ]; then
          echo "apps/api/Dockerfile must pin GIT_FILTER_REPO_VERSION on exactly one ARG line; it has $matches" >&2
          exit 1
        fi
        uv tool install "git-filter-repo==$pinned"
        bin="$(uv tool dir --bin)"
        printf '%s\n' "$bin" >> "$GITHUB_PATH"
        # Proved here rather than left to the suite, so an install that put the tool
        # somewhere git cannot reach fails on this line and not three hundred tests later.
        # `--version`, not `--help`: git answers a subcommand's `--help` by opening its man
        # page, which the runner does not carry, and exits 16 with the tool installed (PR #57's
        # first CI run, 11/09/2026); `--version` is answered by the tool itself.
        PATH="$bin:$PATH" git filter-repo --version > /dev/null
