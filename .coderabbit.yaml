# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# inheritance: false stops the organisation's settings applying. Their path
# filter matched no file, so every pull request was skipped.
language: en-GB
inheritance: false
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!apps/worker/uv.lock"
    - "!packages/schema/migrations/meta/**"
    - "!.cubic/wiki/**"
    - "!**/THIRD_PARTY_NOTICES.md"
  path_instructions:
    - path: "**/*"
      instructions: |
        The owner is not a developer. Explain each finding in plain words and say what breaks.
        Deep modules: much behaviour behind a small interface. A wide interface over thin behaviour is a finding even when the code is correct.
    - path: "packages/schema/migrations/**"
      instructions: A migration cannot be undone by reverting the pull request. Check that it is safe on data already in the table.

chat:
  auto_reply: true
